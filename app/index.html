<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B2 Ready UK — B2 English practice for UK visas</title>
<meta name="description" content="Practise for the B2 English test UK visas require: mock tests, reading, British-accent listening, writing feedback, speaking recorder, grammar and vocabulary. Works offline.">
<meta name="theme-color" content="#2347c5">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png">
<style>/* B2 Ready UK by HB LABS — design system v3, following Apple's Human Interface Guidelines.
   Layout: iPadOS/macOS split view — translucent sidebar, large-title content, inset grouped lists.
   Type: San Francisco (system) for UI, New York (ui-serif) for reading passages. */
:root {
  --bg: #f2f2f7;              /* systemGroupedBackground */
  --bg-2: #ffffff;            /* secondarySystemGroupedBackground */
  --card: #ffffff;
  --fill: rgba(120, 120, 128, .12);   /* tertiarySystemFill */
  --fill-2: rgba(120, 120, 128, .08);
  --ink: #1d1d1f;             /* label */
  --ink-2: #3a3a3c;
  --muted: #6e6e73;           /* secondaryLabel */
  --faint: #aeaeb2;           /* tertiaryLabel */
  --line: rgba(60, 60, 67, .14);      /* separator */
  --line-2: rgba(60, 60, 67, .22);
  --hover: rgba(120, 120, 128, .08);
  --accent: #0071e3;          /* systemBlue (apple.com) */
  --accent-ink: #ffffff;
  --accent-soft: rgba(0, 113, 227, .10);
  --good: #248a3d; --good-fill: #34c759; --good-soft: rgba(52, 199, 89, .14);
  --warn: #c93400; --warn-fill: #ff9500; --warn-soft: rgba(255, 149, 0, .14);
  --bad: #d70015; --bad-fill: #ff3b30; --bad-soft: rgba(255, 59, 48, .12);
  --c-r: #007aff; --c-l: #34c759; --c-w: #ff9500; --c-s: #ff2d55; --c-g: #5856d6; --c-v: #30b0c7;
  --glass: rgba(246, 246, 248, .78);
  --glass-side: rgba(236, 236, 241, .82);
  --shadow: none;
  --shadow-pop: 0 10px 40px -10px rgba(0, 0, 0, .22), 0 2px 8px rgba(0, 0, 0, .06);
  --radius: 16px;
  --radius-sm: 10px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI Variable Text", "Segoe UI", Roboto, Arial, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI Variable Display", "Segoe UI", Roboto, Arial, sans-serif;
  --serif: ui-serif, "New York", "Iowan Old Style", Charter, "Sitka Text", Georgia, serif;
  --ease: cubic-bezier(.25, .8, .25, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --bg-2: #1c1c1e; --card: #1c1c1e; --fill: rgba(118, 118, 128, .24); --fill-2: rgba(118, 118, 128, .16);
    --ink: #f5f5f7; --ink-2: #d1d1d6; --muted: #98989d; --faint: #636366; --line: rgba(84, 84, 88, .55); --line-2: rgba(84, 84, 88, .8);
    --hover: rgba(118, 118, 128, .18); --accent: #0a84ff; --accent-ink: #ffffff; --accent-soft: rgba(10, 132, 255, .18);
    --good: #30d158; --good-fill: #30d158; --good-soft: rgba(48, 209, 88, .16); --warn: #ff9f0a; --warn-fill: #ff9f0a; --warn-soft: rgba(255, 159, 10, .16);
    --bad: #ff453a; --bad-fill: #ff453a; --bad-soft: rgba(255, 69, 58, .16);
    --c-r: #0a84ff; --c-l: #30d158; --c-w: #ff9f0a; --c-s: #ff375f; --c-g: #5e5ce6; --c-v: #40c8e0;
    --glass: rgba(22, 22, 24, .78); --glass-side: rgba(28, 28, 30, .82); --shadow-pop: 0 10px 40px -10px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --bg-2: #1c1c1e; --card: #1c1c1e; --fill: rgba(118, 118, 128, .24); --fill-2: rgba(118, 118, 128, .16);
  --ink: #f5f5f7; --ink-2: #d1d1d6; --muted: #98989d; --faint: #636366; --line: rgba(84, 84, 88, .55); --line-2: rgba(84, 84, 88, .8);
  --hover: rgba(118, 118, 128, .18); --accent: #0a84ff; --accent-ink: #ffffff; --accent-soft: rgba(10, 132, 255, .18);
  --good: #30d158; --good-fill: #30d158; --good-soft: rgba(48, 209, 88, .16); --warn: #ff9f0a; --warn-fill: #ff9f0a; --warn-soft: rgba(255, 159, 10, .16);
  --bad: #ff453a; --bad-fill: #ff453a; --bad-soft: rgba(255, 69, 58, .16);
  --c-r: #0a84ff; --c-l: #30d158; --c-w: #ff9f0a; --c-s: #ff375f; --c-g: #5e5ce6; --c-v: #40c8e0;
  --glass: rgba(22, 22, 24, .78); --glass-side: rgba(28, 28, 30, .82); --shadow-pop: 0 10px 40px -10px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font);
  font-size: 15px; line-height: 1.47; letter-spacing: -.008em;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--display); margin: 0 0 .4em; color: var(--ink); text-wrap: balance; }
h1 { font-size: clamp(1.75rem, 3vw, 2.125rem); font-weight: 700; letter-spacing: -.022em; line-height: 1.12; }
h2 { font-size: 1.25rem; font-weight: 600; letter-spacing: -.018em; line-height: 1.25; }
h3 { font-size: 1.0625rem; font-weight: 600; letter-spacing: -.012em; line-height: 1.3; }
p { margin: 0 0 1em; }
b, strong { font-weight: 600; }
small, .muted { color: var(--muted); }
button { font: inherit; color: inherit; letter-spacing: inherit; }
::selection { background: var(--accent-soft); }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; border-radius: 8px; }
svg { flex: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--glass-side); backdrop-filter: saturate(180%) blur(30px); -webkit-backdrop-filter: saturate(180%) blur(30px);
  border-right: .5px solid var(--line-2);
  padding: 18px 12px 14px; display: flex; flex-direction: column;
}
.brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 20px; color: var(--ink); }
.brand:hover { text-decoration: none; }
.brand-mark { width: 34px; height: 34px; filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, .18)); }
.brand b { display: block; font-size: 1rem; letter-spacing: -.02em; font-weight: 700; line-height: 1.2; }
.brand span { display: block; font-size: .75rem; color: var(--muted); font-weight: 500; }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav-label { font-size: .72rem; font-weight: 600; color: var(--muted); padding: 16px 12px 5px; letter-spacing: 0; }
.nav a {
  display: flex; align-items: center; gap: 11px; height: 34px; padding: 0 12px; border-radius: 9px;
  color: var(--ink); font-weight: 500; font-size: .9rem; letter-spacing: -.01em;
  transition: background-color .15s var(--ease);
}
.nav a svg { width: 19px; height: 19px; color: var(--accent); stroke-width: 1.9; }
.nav a:hover { background: var(--hover); text-decoration: none; }
.nav a.on { background: var(--accent); color: var(--accent-ink); }
.nav a.on svg { color: var(--accent-ink); }
.nav a.cta { color: var(--accent); font-weight: 600; }
.side-foot { margin-top: auto; padding: 14px 12px 2px; font-size: .74rem; color: var(--muted); line-height: 1.55; }
.edition-chip { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--ink); }
.edition-chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--good-fill); }
.edition-chip.free::before { background: var(--warn-fill); }

.main { min-width: 0; width: 100%; max-width: 1120px; padding: 44px clamp(16px, 4.5vw, 56px) 110px; }
.topbar { display: none; }
.tabs { display: none; }

@media (max-width: 880px) {
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    position: sticky; top: 0; z-index: 20; background: var(--glass);
    backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: .5px solid var(--line-2); padding: 9px 16px; padding-top: calc(9px + env(safe-area-inset-top, 0px));
  }
  .topbar .brand { padding: 0; }
  .topbar .brand-mark { width: 30px; height: 30px; }
  .main { padding: 24px 16px 112px; }
  .tabs {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--glass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: .5px solid var(--line-2); padding: 6px 4px calc(4px + env(safe-area-inset-bottom, 0px));
  }
  .tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .64rem; font-weight: 500; color: var(--muted); padding: 2px 0; letter-spacing: 0; }
  .tabs a:hover { text-decoration: none; }
  .tabs a svg { width: 25px; height: 25px; stroke-width: 1.7; }
  .tabs a.on { color: var(--accent); }
}

/* ---------- page header ---------- */
.ph { margin-bottom: 26px; max-width: 68ch; }
.kicker { font-size: .8125rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; letter-spacing: -.005em; }
.lead { font-size: 1.0625rem; color: var(--muted); line-height: 1.47; margin-bottom: 0; letter-spacing: -.012em; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 38px 0 12px; }
.section-title h2 { margin: 0; font-size: 1.375rem; font-weight: 700; letter-spacing: -.022em; }
.section-title a, .section-title span { font-size: .9rem; }

/* ---------- surfaces ---------- */
.card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.card + .card { margin-top: 16px; }
.grid > .card, .grid > .card + .card { margin-top: 0; }
.card.flat { background: var(--fill-2); }
.card.pad-lg { padding: 24px 26px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-head h2, .card-head h3 { margin: 0; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); }
@media (max-width: 1040px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g-main { grid-template-columns: 1fr; } }
@media (max-width: 620px) { .g2, .g3, .g4 { grid-template-columns: 1fr; } }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack > * + * { margin-top: 10px; }
.mt { margin-top: 14px; } .mt2 { margin-top: 28px; } .mb0 { margin-bottom: 0; }
.center { text-align: center; }
.hide { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- buttons (pill, Apple web style) ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px;
  border: 0; border-radius: 980px; padding: 0 18px; font-weight: 500; font-size: .9rem; letter-spacing: -.01em;
  background: var(--accent); color: var(--accent-ink); cursor: pointer; line-height: 1; white-space: nowrap;
  transition: filter .15s var(--ease), background-color .15s var(--ease), transform .1s var(--ease);
}
.btn:hover { text-decoration: none; filter: brightness(1.08); }
.btn:active { transform: scale(.97); }
.btn[disabled] { opacity: .35; cursor: not-allowed; filter: none; transform: none; }
.btn.ghost { background: var(--fill); color: var(--accent); }
.btn.ghost:hover { filter: none; background: color-mix(in srgb, var(--fill) 100%, var(--ink) 6%); }
.btn.quiet { background: transparent; color: var(--accent); padding: 0 8px; }
.btn.quiet:hover { filter: none; background: var(--hover); }
.btn.accent { background: var(--accent); color: var(--accent-ink); }
.btn.good { background: var(--good-fill); color: #fff; }
.btn.danger { background: var(--fill); color: var(--bad); }
.btn.danger:hover { filter: none; background: var(--bad-soft); }
.btn.sm { height: 30px; padding: 0 13px; font-size: .84rem; }
.btn.lg { height: 46px; padding: 0 24px; font-size: 1.0625rem; }
.btn.block { width: 100%; }
.btn svg { width: 16px; height: 16px; stroke-width: 2; }
.btn.lg svg { width: 18px; height: 18px; }
.btn.icon { width: 36px; padding: 0; }
.btn.sm.icon { width: 30px; }

.badge {
  display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 9px; border-radius: 980px;
  font-size: .75rem; font-weight: 600; letter-spacing: -.005em; white-space: nowrap;
  background: var(--fill); color: var(--ink-2);
}
.badge svg { width: 12px; height: 12px; stroke-width: 2.4; }
.badge.good { background: var(--good-soft); color: var(--good); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.pri { background: var(--accent-soft); color: var(--accent); }
.badge.lockb { background: var(--fill-2); color: var(--muted); }
.dotc { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.hr { height: .5px; background: var(--line-2); margin: 18px 0; border: 0; }

/* ---------- dashboard ---------- */
.welcome { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; flex-wrap: wrap; margin-bottom: 26px; }
.welcome h1 { margin-bottom: 4px; }
.stat-chips { display: flex; gap: 10px; flex-wrap: wrap; }
.stat-chip { display: flex; align-items: center; gap: 10px; padding: 9px 14px 9px 10px; border-radius: 14px; background: var(--card); }
.stat-chip .sq { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; }
.stat-chip .sq svg { width: 17px; height: 17px; stroke-width: 2; }
.stat-chip b { font-size: 1.0625rem; font-variant-numeric: tabular-nums; display: block; line-height: 1.1; letter-spacing: -.02em; }
.stat-chip small { display: block; font-size: .72rem; line-height: 1.25; }

.rings-wrap { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 26px; align-items: center; }
@media (max-width: 560px) { .rings-wrap { grid-template-columns: 1fr; justify-items: center; } }
.rings { width: 200px; height: 200px; }
.rings circle { fill: none; stroke-linecap: round; }
.rings .ring-fg { transition: stroke-dashoffset 1.1s var(--ease); }
.legend { list-style: none; margin: 0; padding: 0; width: 100%; }
.legend li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: .5px solid var(--line); }
.legend li:last-child { border-bottom: 0; }
.legend .nm { font-weight: 600; font-size: .92rem; }
.legend .nm small { display: block; font-weight: 400; font-size: .78rem; }
.legend .v { font-variant-numeric: tabular-nums; font-weight: 600; font-size: .95rem; text-align: right; }
.legend .v small { display: block; font-weight: 500; font-size: .72rem; }
.minis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.mini { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--fill-2); }
.mini .sq { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: #fff; }
.mini .sq svg { width: 16px; height: 16px; stroke-width: 2; }
.mini b { font-size: .86rem; display: block; line-height: 1.2; }
.mini small { font-size: .74rem; }
.mini .val { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; font-size: .92rem; }

/* meters (results) */
.meter { display: grid; grid-template-columns: 110px minmax(0, 1fr) 128px; align-items: center; gap: 14px; padding: 12px 0; }
.meter + .meter { border-top: .5px solid var(--line); }
.meter .lbl { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: .92rem; }
.meter .val { text-align: right; font-size: .84rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter .val b { color: var(--ink); font-size: .95rem; }
.track { position: relative; height: 8px; border-radius: 99px; background: var(--fill); }
.track > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--accent); transition: width .8s var(--ease); }
.track .b2 { position: absolute; left: 60%; top: -4px; bottom: -4px; width: 2px; border-radius: 2px; background: var(--ink); opacity: .35; }
@media (max-width: 560px) { .meter { grid-template-columns: 90px minmax(0, 1fr); } .meter .val { grid-column: 1 / -1; text-align: left; } }

.next-card { display: flex; gap: 14px; align-items: flex-start; }
.next-card .day { flex: none; width: 50px; height: 54px; border-radius: 12px; background: var(--fill-2); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; overflow: hidden; }
.next-card .day small { font-size: .62rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--bad-fill); }
.next-card .day b { font-size: 1.45rem; font-weight: 600; margin-top: 2px; letter-spacing: -.03em; }
.tasklist { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; }
.tasklist li { display: flex; gap: 8px; align-items: flex-start; font-size: .9rem; }
.tasklist li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); margin-top: 8px; flex: none; }

/* tiles + Settings-style icon squircles */
.tile { display: flex; flex-direction: column; color: inherit; position: relative; transition: transform .2s var(--ease), box-shadow .2s var(--ease); }
.tile:hover { text-decoration: none; transform: translateY(-2px); box-shadow: var(--shadow-pop); }
.tile .ico { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 14px; color: #fff; background: var(--muted); }
.tile .ico svg { width: 22px; height: 22px; stroke-width: 1.9; }
.tile h3 { margin-bottom: 3px; }
.tile p { margin: 0; font-size: .875rem; color: var(--muted); line-height: 1.45; }
.tile .go { position: absolute; top: 22px; right: 20px; color: var(--faint); transition: color .15s var(--ease), transform .2s var(--ease); }
.tile .go svg { width: 18px; height: 18px; stroke-width: 2.2; }
.tile:hover .go { color: var(--accent); transform: translateX(2px); }
.tile .lock { position: absolute; top: 18px; right: 18px; }
.tile .foot { margin-top: auto; padding-top: 16px; }
.ico.r, .sq.r { background: var(--c-r); } .ico.l, .sq.l { background: var(--c-l); } .ico.w, .sq.w { background: var(--c-w); }
.ico.s, .sq.s { background: var(--c-s); } .ico.g, .sq.g { background: var(--c-g); } .ico.v, .sq.v { background: var(--c-v); }
.sq.k { background: #8e8e93; } .sq.red { background: var(--bad-fill); } .sq.org { background: var(--warn-fill); }

/* progress bar */
.bar { height: 6px; border-radius: 99px; background: var(--fill); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .6s var(--ease); }
.bar.good > i { background: var(--good-fill); } .bar.warn > i { background: var(--warn-fill); } .bar.bad > i { background: var(--bad-fill); }

/* inset grouped lists */
.list { list-style: none; padding: 0; margin: 0; }
.list.card { padding: 0; overflow: hidden; }
.list li { display: flex; align-items: center; gap: 12px; padding: 11px 16px; position: relative; }
.list li + li::before { content: ""; position: absolute; top: 0; right: 0; left: 60px; height: .5px; background: var(--line-2); }
.list li:not(:has(.lico)) + li::before { left: 16px; }
.list a.item { display: flex; align-items: center; gap: 14px; width: 100%; color: inherit; }
.list a.item:hover { text-decoration: none; }
.list li:has(a.item):hover { background: var(--hover); }
.list .grow { flex: 1; min-width: 0; }
.list .grow b { font-weight: 500; font-size: .95rem; letter-spacing: -.012em; }
.list .grow small { display: block; font-size: .8rem; }
.list .lico { width: 30px; height: 30px; border-radius: 7.5px; display: grid; place-items: center; flex: none; color: #fff; background: var(--muted); }
.list .lico svg { width: 17px; height: 17px; stroke-width: 2; }
.list .chev { color: var(--faint); width: 16px; height: 16px; stroke-width: 2.4; }

/* ---------- exam interface ---------- */
.exambar {
  position: sticky; top: 0; z-index: 15; margin: -44px calc(-1 * clamp(16px, 4.5vw, 56px)) 22px; padding: 10px clamp(16px, 4.5vw, 56px);
  background: var(--glass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);

<script>window.B2DATA={"mocks":[{"id":"m1","free":true,"title":"Mock Test 1","theme":"Starting work in the UK","reading":{"time":35,"passages":[{"id":"m1r1","title":"Is the four-day week the future of work?","labels":true,"paras":["When a group of British companies agreed to test a four-day working week, many observers expected the experiment to fail. Staff were asked to work around 80 per cent of their usual hours for their full salary, as long as they kept up the same level of output. Six months later, most of the participating firms announced that they would carry on with the new pattern, and several had already made it a permanent part of their contracts.","Supporters argue that the results were not as surprising as they first appeared. Studies of office work have long suggested that people are genuinely productive for only part of the working day, with the rest lost to unnecessary meetings, interruptions and tiredness. When time becomes scarce, managers say, teams become far more disciplined about how they use it. One software company reported that it had cut its regular meetings from an hour to twenty-five minutes without any loss of quality.","The benefits for employees are easier to measure. Workers in the trial reported lower levels of stress and burnout, and many said they had more time for exercise, family and hobbies. Some employers also noticed a drop in sick days. Perhaps most significantly for businesses, firms found it easier to recruit new staff, since a shorter week had become an attractive perk in a competitive job market.","However, critics point out that the model does not suit every industry. In hospitals, schools and shops, someone has to be present for a fixed number of hours, so a shorter week for each employee usually means hiring more people, which raises costs. Others worry that squeezing five days of work into four could simply increase pressure, leading to longer, more intense days rather than a better balance.","For now, the four-day week remains the exception rather than the rule in the UK. Most experts believe that, rather than a single national policy, change is likely to come gradually, with individual employers experimenting with different versions — such as shorter days, or a nine-day fortnight — to find what works for them and their customers."],"groups":[{"instr":"Questions 1–5: The text has five paragraphs, A–E. Choose the correct heading for each paragraph from the list of headings.","listOptions":true,"listType":"i","options":["A trial that went better than predicted","Why less time can mean better work","Clear gains for staff — and for hiring","Sectors where the idea is harder to apply","A gradual, flexible change rather than a sudden one","The government's plan for new working laws","How technology replaced office meetings"],"items":[{"type":"select","q":"Paragraph A","answer":0,"explain":"Observers \"expected the experiment to fail\", but most firms carried on — it went better than predicted."},{"type":"select","q":"Paragraph B","answer":1,"explain":"\"When time becomes scarce… teams become far more disciplined\" — less time, better use of it."},{"type":"select","q":"Paragraph C","answer":2,"explain":"Lower stress for workers and \"easier to recruit new staff\"."},{"type":"select","q":"Paragraph D","answer":3,"explain":"\"Does not suit every industry\" — hospitals, schools and shops."},{"type":"select","q":"Paragraph E","answer":4,"explain":"\"Change is likely to come gradually\", with employers trying different versions. Note: no government plan is mentioned (heading vi is a distractor)."}]},{"instr":"Questions 6–8: Choose the correct letter, A, B, C or D.","items":[{"type":"mcq","q":"What condition did employees have to meet during the trial?","options":["Work longer hours on each of the four days","Keep producing the same amount of work","Accept a small reduction in salary","Give up some of their annual holiday"],"answer":1,"explain":"\"…as long as they kept up the same level of output.\""},{"type":"mcq","q":"According to paragraph B, why might a shorter week not reduce productivity?","options":["Companies hired extra staff to cover the missing day.","Much of a normal working day is not used productively.","Employees agreed to work some weekends.","Meetings were banned completely during the trial."],"answer":1,"explain":"People are \"genuinely productive for only part of the working day\". Meetings were shortened, not banned."},{"type":"mcq","q":"What concern do critics raise in paragraph D?","options":["Workers may become bored with fewer tasks.","Customers will refuse to accept the change.","Working days could become more stressful.","Salaries across the industry will fall."],"answer":2,"explain":"\"…leading to longer, more intense days rather than a better balance.\""}]}]},{"id":"m1r2","title":"Renting a home in England: what new arrivals should know","paras":["Finding somewhere to live is often the first major challenge for people moving to the UK for work. Most rented homes are advertised online through property websites, and are managed either by the landlord directly or by a letting agent acting on the landlord's behalf. Demand is high in many cities, so good properties can be taken within days of being advertised, and it is common to be asked to attend a viewing at short notice.","Before a tenancy begins, landlords in England are legally required to check that every adult tenant has the right to rent in the UK. For visa holders, this usually means sharing a code that allows the landlord to view their immigration status online. Tenants will also normally be asked to pay a deposit, which for most homes cannot be more than five weeks' rent. The landlord must place this money in a government-approved protection scheme, which keeps it safe and helps to resolve any disagreements when the tenancy ends.","Since 2019, letting agents and landlords in England have been banned from charging most extra fees, such as charges for preparing contracts or carrying out reference checks. However, tenants can still be charged in certain situations — for example, if they lose a key or ask to change the tenancy agreement.","When budgeting, newcomers are sometimes surprised by the costs that are not included in the rent. In most cases, tenants are responsible for paying council tax, which funds local services such as rubbish collection, as well as gas, electricity, water and internet bills. A single adult living alone can usually claim a 25 per cent discount on council tax, which is worth applying for straight away.","Finally, experts recommend checking the property carefully on the day you move in. A detailed inventory, ideally with dated photographs, records the condition of the furniture, walls and appliances. Without one, it can be difficult to prove that damage was already there, and tenants may lose part of their deposit as a result."],"groups":[{"instr":"Questions 9–16: Do the statements agree with the information in the text? Choose TRUE if the statement agrees, FALSE if it contradicts the text, or NOT GIVEN if there is no information about it.","items":[{"type":"tfng","q":"Most rented homes in the UK are advertised in local newspapers.","answer":"FALSE","explain":"\"Most rented homes are advertised online through property websites.\""},{"type":"tfng","q":"Landlords in England must check whether adult tenants are allowed to rent in the UK.","answer":"TRUE","explain":"\"Landlords in England are legally required to check that every adult tenant has the right to rent.\""},{"type":"tfng","q":"Most visa holders find the right-to-rent process difficult.","answer":"NOT GIVEN","explain":"The text explains the process but says nothing about whether people find it difficult."},{"type":"tfng","q":"A deposit protection scheme can help when a landlord and tenant disagree.","answer":"TRUE","explain":"The scheme \"helps to resolve any disagreements when the tenancy ends\"."},{"type":"tfng","q":"Letting agents in England can charge tenants for preparing the contract.","answer":"FALSE","explain":"They \"have been banned from charging most extra fees, such as charges for preparing contracts\"."},{"type":"tfng","q":"Council tax is usually included in the monthly rent.","answer":"FALSE","explain":"Costs \"not included in the rent… tenants are responsible for paying council tax\"."},{"type":"tfng","q":"Adults who live alone can usually pay less council tax.","answer":"TRUE","explain":"\"A single adult living alone can usually claim a 25 per cent discount.\""},{"type":"tfng","q":"Most deposit disagreements are caused by tenants who did not make an inventory.","answer":"NOT GIVEN","explain":"The text says an inventory helps, but gives no information about the main cause of disagreements."}]}]},{"id":"m1r3","title":"Why do we forget people's names?","paras":["Almost everyone has had the embarrassing experience of being introduced to someone and forgetting their name only seconds later. Psychologists say this is not a sign of a poor memory, but rather a result of the way our brains process new information.","One explanation is that names are unusually difficult to remember because they carry very little meaning. If you learn that a new colleague is a keen cyclist or comes from Manchester, you can link that information to things you already know. A name like \"Sarah\" or \"Daniel\", however, tells you almost nothing about the person, so the brain has nothing to attach it to. In one well-known type of experiment, people were far more likely to remember that a man worked as a baker than that his surname was Baker — even though the word was identical.","Attention also plays a major role. When we meet someone new, we are often busy thinking about the impression we are making, or planning what to say next. As a result, the name is never properly stored in the first place. Strictly speaking, it is not forgotten at all; it was simply never learned.","The good news is that there are simple techniques that can help. Repeating the name out loud as soon as you hear it — \"Nice to meet you, Priya\" — gives the brain a second chance to record it. Another strategy is to create a mental image that connects the name with something memorable about the person, such as picturing a colleague called Rose holding a bunch of flowers. Finally, using the name again at the end of a conversation helps to move it from short-term to long-term memory."],"groups":[{"instr":"Questions 17–21: Complete the summary. Use NO MORE THAN TWO WORDS from the text for each answer.","items":[{"type":"gap","q":"Forgetting a new name quickly does not mean that a person has a poor ___.","answer":["memory"],"explain":"\"…this is not a sign of a poor memory.\""},{"type":"gap","q":"Names are hard to remember because they carry very little ___.","answer":["meaning"],"explain":"\"…they carry very little meaning.\""},{"type":"gap","q":"In experiments, people remembered that a man was a ___ more easily than they remembered his surname.","answer":["baker"],"explain":"\"…remember that a man worked as a baker than that his surname was Baker.\""},{"type":"gap","q":"Names are often not stored because we are thinking about the ___ we are making.","answer":["impression"],"explain":"\"…busy thinking about the impression we are making.\""},{"type":"gap","q":"Using a name again at the end of a conversation helps it enter ___ memory.","answer":["long-term","long term"],"explain":"\"…move it from short-term to long-term memory.\""}]},{"instr":"Question 22: Choose the correct letter, A, B, C or D.","items":[{"type":"mcq","q":"What is the writer's main purpose in the text?","options":["To criticise people who forget names","To explain why names are forgotten and suggest ways to remember them","To describe one famous psychology experiment in detail","To compare short-term and long-term memory"],"answer":1,"explain":"The text gives reasons (meaning, attention) and then \"simple techniques that can help\"."}]}]}]},"listening":{"time":25,"parts":[{"id":"m1l1","title":"Registering with a doctor","context":"You will hear a man phoning a medical centre to register as a new patient. Questions 1–6: Complete the form. Write ONE WORD AND/OR A NUMBER for each answer. Then answer questions 7–8.","speakers":{"A":{"name":"Receptionist","g":"f"},"B":{"name":"Daniel","g":"m"}},"script":[["A","Good morning, Riverside Medical Centre. How can I help?"],["B","Hello. I've just moved to the area and I'd like to register as a new patient, please."],["A","Of course. I can take some details over the phone, and then you'll need to complete a short health questionnaire. Can I have your full name?"],["B","Yes, it's Daniel Okafor."],["A","Could you spell your surname for me?"],["B","Sure. It's O. K. A. F. O. R."],["A","Thank you. And your date of birth?"],["B","The fourteenth of March, nineteen ninety-one."],["A","Lovely. What's your current address?"],["B","It's Flat 3, twenty-seven Elmwood Road."],["A","Elmwood Road. That's within our area, so that's fine. And the postcode?"],["B","B. S. 6. 4. T. R."],["A","Great. And are you taking any medication at the moment?"],["B","Just an inhaler for asthma, but I only use it occasionally, mostly when I go running."],["A","OK, I'll make a note of that. Have you been registered with a doctor in the UK before?"],["B","No, I arrived from Lagos about three weeks ago. I'm working as a nurse at the city hospital."],["A","Ah, welcome to Bristol! In that case, we'll need to see your passport or your eVisa details when you come in."],["B","That's fine. Do I need to book a time to bring the forms?"],["A","No, you don't need an appointment for that. We're open from eight until half past six on weekdays, but try to avoid Monday mornings if you can. That's our busiest time."],["B","I'm working on Monday and Tuesday anyway, so I'll come in on Wednesday afternoon."],["A","Perfect. And once you're registered, you can book a new patient check with the practice nurse. It used to take half an hour, but now it's only about twenty minutes."],["B","Great. Thanks very much for your help."]],"groups":[{"instr":"Questions 1–6: New patient form","items":[{"type":"gap","q":"Surname: ___","answer":["Okafor"],"explain":"He spells it: O-K-A-F-O-R."},{"type":"gap","q":"Date of birth: 14 ___ 1991","answer":["March"]},{"type":"gap","q":"Address: Flat 3, ___ Elmwood Road","answer":["27","twenty-seven","twenty seven"]},{"type":"gap","q":"Postcode: ___","answer":["BS6 4TR","BS64TR","BS6 4 TR"]},{"type":"gap","q":"Medication: an inhaler for ___","answer":["asthma"]},{"type":"gap","q":"Occupation: ___","answer":["nurse"]}]},{"instr":"Questions 7–8: Choose the correct letter, A, B or C.","items":[{"type":"mcq","q":"When does Daniel plan to visit the medical centre?","options":["Monday morning","Wednesday afternoon","Friday after work"],"answer":1,"explain":"Monday is mentioned as the busiest time (a distractor). He says \"I'll come in on Wednesday afternoon.\""},{"type":"mcq","q":"How long does the new patient check take now?","options":["About ten minutes","About twenty minutes","About thirty minutes"],"answer":1,"explain":"\"It used to take half an hour, but now it's only about twenty minutes.\" Listen for changes like \"used to\"."}]}]},{"id":"m1l2","title":"A welcome talk for new staff","context":"You will hear a training manager giving a talk to new employees at a hotel. Questions 9–15.","speakers":{"A":{"name":"Mark (training manager)","g":"m"}},"script":[["A","Good morning, everyone, and welcome to Harbour Hotels. My name's Mark Ellis, and I'm the training manager here. I'm going to take about ten minutes to explain how your first week will work, so please hold any questions until the end."],["A","First of all, the most important thing today is your ID badge. Some of you have asked whether you can collect it from reception — you can't, I'm afraid. You'll collect it from security on the ground floor straight after this talk. You'll need it for absolutely everything: to get into staff areas, to use the lockers and even to pay in the canteen. So please don't leave it at home."],["A","Now, about the canteen. It's on the lower ground floor and it's open to staff from seven in the morning until ten at night. Meals are heavily subsidised, so a hot lunch costs just two pounds fifty. Hot drinks, though, are completely free, so help yourselves."],["A","Your training will be split between the classroom and the hotel floor. Today and tomorrow, you'll be in the training room, learning about our booking system and health and safety. On Wednesday, you'll start shadowing an experienced colleague in your own department. Many people tell me that's the day they learn the most, so make the most of it. Thursday is customer service training, which is run by an external company, and on Friday afternoon you'll have a short review meeting with your line manager to discuss how the week has gone."],["A","A few practical points. Uniforms will be given out on Wednesday morning, so for the first two days, please wear smart clothes. Dark trousers or a skirt and a plain shirt are perfect. And if you're ever going to be late, or you're unwell, you must phone your manager directly — not just send a text message or an email — at least two hours before your shift starts."],["A","Finally, I'd encourage all of you to download our staff app. It's where we post shift changes, but it also has information about discounts at local businesses and our monthly social events. Right. Are there any questions?"]],"groups":[{"instr":"Questions 9–14: Choose the correct letter, A, B or C.","items":[{"type":"mcq","q":"Where should new staff collect their ID badge?","options":["From the reception desk","From security on the ground floor","From their line manager"],"answer":1,"explain":"Reception is mentioned, but rejected: \"you can't, I'm afraid\"."},{"type":"mcq","q":"What does the speaker say about Wednesday?","options":["Staff will meet their line manager.","Many new staff find it the most useful day.","Training takes place in the classroom."],"answer":1,"explain":"\"Many people tell me that's the day they learn the most.\""},{"type":"mcq","q":"Who runs the customer service training?","options":["The training manager","An outside company","Experienced colleagues"],"answer":1,"explain":"\"…run by an external company\" — \"external\" = \"outside\"."},{"type":"mcq","q":"What should staff wear on Monday and Tuesday?","options":["Their hotel uniform","Smart clothes","Anything comfortable"],"answer":1,"explain":"Uniforms are given out on Wednesday, so \"for the first two days, please wear smart clothes\"."},{"type":"mcq","q":"What must staff do if they are ill?","options":["Email the HR department","Send their manager a text message","Telephone their manager"],"answer":2,"explain":"\"You must phone your manager directly — not just send a text message or an email.\""},{"type":"mcq","q":"What is the main purpose of the staff app?","options":["To show changes to work schedules","To order meals from the canteen","To book training sessions"],"answer":0,"explain":"\"It's where we post shift changes\" — discounts and social events are extras."}]},{"instr":"Question 15: Write ONE WORD AND/OR A NUMBER.","items":[{"type":"gap","q":"A hot lunch in the staff canteen costs £___.","answer":["2.50","2.5","£2.50","two pounds fifty","2 pounds 50"],"explain":"\"…a hot lunch costs just two pounds fifty.\" Hot drinks are free."}]}]},{"id":"m1l3","title":"Discussing an office move","context":"You will hear two colleagues, Aisha and Tom, discussing the results of a staff survey about moving to a new office. Questions 16–21.","speakers":{"A":{"name":"Aisha","g":"f"},"B":{"name":"Tom","g":"m"}},"script":[["B","So, Aisha, have you had a chance to look at the staff survey results?"],["A","I have. I must say, I was surprised by how many people are against moving to the new office."],["B","Really? I thought it would be popular. It's much more modern, and it's right next to the train station."],["A","That's true, and the location is definitely a plus. I'd find it much easier to get to. But the main complaint was about the open-plan layout. Lots of people said they'd struggle to concentrate without private offices."],["B","Hmm. I can understand that, but personally I think open-plan spaces help teams communicate. At the moment, people in different departments hardly ever speak to each other."],["A","Maybe, but communication isn't much use if nobody can get any work done. I think we need to include some quiet rooms in the design: small spaces people can book when they need to focus."],["B","That's a good idea. I'd support that. What about parking? I noticed that came up a lot as well."],["A","Yes, the new building only has about half the parking spaces we have now. Although, to be honest, I don't think that's a big problem. With the station so close, more people will take the train."],["B","I'm not so sure. A lot of our staff live in villages with no rail service at all. For them, driving is the only option. I think the company should pay for extra spaces in the car park across the road."],["A","That would be expensive, though. Perhaps we could offer a car-sharing scheme instead."],["B","Mm, that might work for some people. Anyway, we both agree the move needs to happen. The current building is far too small for us now."],["A","Absolutely. We just need to present it in the right way. Shall we put together a short presentation for the staff meeting next Thursday?"],["B","Good plan. I'll draft the slides about the new design, if you can collect the figures from the survey."],["A","Deal."]],"groups":[{"instr":"Questions 16–20: Who expresses each opinion? Choose A if only Aisha does, B if only Tom does, or C if they both do.","listOptions":true,"listType":"A","options":["Aisha only","Tom only","Both Aisha and Tom"],"items":[{"type":"select","q":"The new office is in a convenient location.","answer":2,"explain":"Tom: \"right next to the train station\". Aisha: \"the location is definitely a plus\"."},{"type":"select","q":"An open-plan office can improve communication between departments.","answer":1,"explain":"Tom: \"open-plan spaces help teams communicate\". Aisha doubts it."},{"type":"select","q":"Having fewer parking spaces will not be a serious problem.","answer":0,"explain":"Aisha: \"I don't think that's a big problem.\" Tom: \"I'm not so sure.\""},{"type":"select","q":"The company should pay for extra parking nearby.","answer":1,"explain":"Tom suggests it; Aisha says it \"would be expensive\"."},{"type":"select","q":"The company needs a larger building.","answer":2,"explain":"\"We both agree the move needs to happen. The current building is far too small.\""}]},{"instr":"Question 21: Choose the correct letter, A, B or C.","items":[{"type":"mcq","q":"What will Tom do to prepare for the staff meeting?","options":["Collect the survey figures","Prepare slides about the new design","Contact the owner of the car park"],"answer":1,"explain":"\"I'll draft the slides about the new design\" — Aisha will collect the figures."}]}]}]},"writing":{"time":60,"tasks":[{"type":"email","formality":"formal","minWords":150,"time":20,"title":"Email to a letting agent about a repair","prompt":"You rent a flat through a letting agency. The heating and hot water in your flat stopped working a week ago, and nobody has come to repair it.\n\nWrite an email to the letting agent. In your email:","bullets":["describe the problem and what has happened so far","explain how it is affecting you","say what you would like the agent to do"],"model":"Dear Ms Hughes,\n\nI am writing to report a problem with the heating at Flat 3, 27 Elmwood Road, which I have rented through your agency since September.\n\nLast Monday, the boiler suddenly stopped working, and since then there has been no heating or hot water in the flat. I phoned your office on Tuesday and was told that an engineer would visit within 48 hours. Unfortunately, nobody has come, and I have not received any further information.\n\nThis situation is causing me serious difficulties. The temperature at night has dropped below freezing, so the flat is extremely cold, and I have had to go to a friend's house to shower before work. As I work early shifts at the hospital, this is very inconvenient.\n\nI would be grateful if you could arrange for an engineer to repair the boiler by Friday at the latest. In the meantime, could you please provide a portable heater? I would also like to discuss a partial reduction in rent for the days without heating.\n\nI look forward to hearing from you.\n\nYours sincerely,\n\nDaniel Okafor","notes":"Each bullet point has its own paragraph. The tone is polite but firm (\"I would be grateful if…\", \"Unfortunately…\"). It uses a range of tenses (present perfect \"have rented\", past simple \"phoned\", past passive \"was told\") and ends with a clear request and a correct formal closing."},{"type":"essay","formality":"formal","minWords":250,"time":40,"title":"Language requirements for migrants","prompt":"In many countries, people must now prove that they speak the local language before they can live and work there.\n\nDo the advantages of this outweigh the disadvantages?\n\nGive reasons for your answer and include relevant examples from your own knowledge or experience.","model":"In many countries, including the UK, migrants are now required to prove a certain level of the national language before they can obtain a work visa or settle permanently. While this policy has some drawbacks, I believe its advantages are greater.\n\nThe most obvious benefit is that newcomers who speak the local language can participate fully in society. They can understand their rights at work, communicate with doctors and teachers, and deal with everyday tasks such as renting a flat without relying on others. In my view, this independence is extremely valuable, as it protects people from being exploited and helps them feel at home more quickly. Furthermore, employers benefit from staff who can follow safety instructions and talk confidently with customers, which improves both safety and service.\n\nOn the other hand, language requirements can create barriers. Preparing for an official test takes time and money, and the exams themselves can be expensive, particularly for people from lower-income countries. As a result, skilled workers who are needed in sectors such as healthcare may be discouraged from applying. Some critics also argue that a language can be learned much faster after arrival, through daily contact with native speakers.\n\nHowever, I would argue that these problems should be reduced rather than used as a reason to abandon the rule. Governments could, for example, offer affordable courses or give applicants more time to reach the required level.\n\nIn conclusion, although language requirements place an extra burden on applicants, the benefits for both migrants and the wider community are considerable. Overall, I believe that a reasonable language standard, supported by accessible learning opportunities, is a fair expectation.","notes":"The introduction paraphrases the question and states a clear position. Body paragraph 1 = advantages, body paragraph 2 = disadvantages, paragraph 3 answers the objection, and the conclusion repeats the opinion in new words. Notice the linkers (Furthermore, On the other hand, As a result, However, In conclusion) and B2 vocabulary (participate, exploited, discouraged, burden, considerable)."}]},"speaking":{"part1":{"topic":"Your work and daily routine","qs":["Do you work or are you a student at the moment?","What do you enjoy most about your job or your studies?","How do you usually travel to work or college?","Do you prefer working in the morning or in the evening? Why?","Is there anything you would like to change about your daily routine?"]},"part2":{"title":"Describe a time when you moved to a new place (a new home, city or country).","bullets":["where you moved to and when","why you moved","what was difficult at first","and explain how you felt after a few months"],"model":"I'd like to talk about the time I moved from Lagos to Manchester, about four years ago, when I got a job as a laboratory technician at a hospital there.\n\nThe main reason I moved was my career. I'd been working in a private clinic for several years, but there weren't many opportunities to develop, and I'd always wanted to work in a big teaching hospital. When I saw the advert, I applied straight away, and to be honest, I was quite surprised when they offered me the job.\n\nAt first, quite a few things were difficult. The weather, obviously — I arrived in January, and I don't think I'd ever felt so cold in my life! But the biggest challenge was actually understanding the local accent. People in Manchester speak quite fast, and they use a lot of expressions I'd never heard before, so I often had to ask colleagues to repeat themselves, which was a bit embarrassing. I also felt lonely, because I didn't know anyone outside work.\n\nHowever, after a few months, things got much better. I joined a five-a-side football team, which helped me make friends, and I gradually got used to the accent. By the summer, I felt far more confident, both at work and in my social life. Looking back, I'm really glad I took the risk, because moving taught me to be more independent and adaptable."},"part3":{"qs":["Why do people choose to move to another country for work?","What can employers do to help new arrivals settle in?","Is it easier to settle in a big city or a small town? Why?","Do you think more people will work abroad in the future? Why or why not?"],"model":"I think the main reason is economic. In many countries, salaries for skilled jobs like nursing or engineering are much higher abroad, so people can support their families better. But it isn't only about money. A lot of people move because they want better career opportunities, for example to gain experience in a well-known hospital or company, which can be really valuable later on. And for some, it's about safety or the quality of public services, such as education for their children. So, I would say it's usually a combination of financial and personal reasons."}}},{"id":"m2","title":"Mock Test 2","theme":"Health and wellbeing","locked":true,"teaser":{"reading":[{"id":"m2r1","title":"Why sleep matters more than we think"},{"id":"m2r2","title":"Can a doctor prescribe a choir?"},{"id":"m2r3","title":"The walking cure"}],"listening":[{"id":"m2l1","title":"Joining a leisure centre"},{"id":"m2l2","title":"Open evening at a health centre"},{"id":"m2l3","title":"Planning a staff wellbeing scheme"}]}},{"id":"m3","title":"Mock Test 3","theme":"Technology and the future of work","locked":true,"teaser":{"reading":[{"id":"m3r1","title":"Automation: a threat or an opportunity?"},{"id":"m3r2","title":"Life in the gig economy"},{"id":"m3r3","title":"Starting again: three career changers"}],"listening":[{"id":"m3l1","title":"Booking a phone repair"},{"id":"m3l2","title":"A free digital skills course"},{"id":"m3l3","title":"Planning a presentation"}]}},{"id":"m4","title":"Mock Test 4","theme":"The environment and cities","locked":true,"teaser":{"reading":[{"id":"m4r1","title":"Bringing nature back: the rise of rewilding"},{"id":"m4r2","title":"The 15-minute city"},{"id":"m4r3","title":"The true cost of cheap clothes"}],"listening":[{"id":"m4l1","title":"Booking a bulky waste collection"},{"id":"m4l2","title":"Changes to household recycling"},{"id":"m4l3","title":"Planning a community garden"}]}},{"id":"m5","title":"Mock Test 5","theme":"Learning, community and life in the UK","locked":true,"teaser":{"reading":[{"id":"m5r1","title":"Why do the British talk about the weather?"},{"id":"m5r2","title":"Never too old to learn"},{"id":"m5r3","title":"Giving your time: volunteering in the UK"}],"listening":[{"id":"m5l1","title":"Registering a child at school"},{"id":"m5l2","title":"Welcome to the library"},{"id":"m5l3","title":"Preparing for the Life in the UK test"}]}}],"grammar":[{"id":"g-tenses","free":true,"title":"Perfect tenses","sub":"Present perfect, past simple, past perfect","explain":"\u003cp>\u003cb>Present perfect\u003c/b> (have/has + past participle) links the past to now: life experience, unfinished periods, and recent events with a result now.\u003c/p>\n\u003cul>\u003cli>I \u003cb>have lived\u003c/b> in Leeds \u003cb>since\u003c/b> 2023. \u003ci>(I still live there.)\u003c/i>\u003c/li>\u003cli>She\u003cb>'s\u003c/b> never \u003cb>been\u003c/b> to Scotland.\u003c/li>\u003cli>I\u003cb>'ve lost\u003c/b> my keys. \u003ci>(I can't find them now.)\u003c/i>\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Past simple\u003c/b> is for finished time: \u003ci>yesterday, last year, in 2019, two weeks ago\u003c/i>. Never use the present perfect with these words.\u003c/p>\n\u003cp>\u003cb>Present perfect continuous\u003c/b> (have been + -ing) stresses duration: \u003ci>I've been waiting for an hour.\u003c/i>\u003c/p>\n\u003cp>\u003cb>Past perfect\u003c/b> (had + past participle) shows which past event happened first: \u003ci>When I arrived, the meeting \u003cb>had\u003c/b> already \u003cb>started\u003c/b>.\u003c/i>\u003c/p>\n\u003cp>\u003cb>for\u003c/b> + a period (for three years) · \u003cb>since\u003c/b> + a starting point (since March).\u003c/p>","items":[{"type":"gap","q":"I ___ (work) here since 2022.","answer":["have worked","'ve worked","have been working","'ve been working"],"explain":"Since + starting point → present perfect (simple or continuous)."},{"type":"mcq","q":"We ___ to Manchester last year.","options":["have moved","moved","had moved","have been moving"],"answer":1,"explain":"\"Last year\" is finished time → past simple."},{"type":"mcq","q":"By the time the ambulance arrived, the man ___.","options":["already left","has already left","had already left","was already leaving"],"answer":2,"explain":"He left before the ambulance arrived → past perfect."},{"type":"mcq","q":"Sorry I'm late. ___ long?","options":["Have you been waiting","Did you wait","Had you waited","Are you waiting"],"answer":0,"explain":"An activity that started in the past and continues until now → present perfect continuous."},{"type":"gap","q":"She has worked for the NHS ___ fifteen years.","answer":["for"],"explain":"For + a period of time."},{"type":"gap","q":"They have known each other ___ they were at school.","answer":["since"],"explain":"Since + a point in time (here, a clause)."},{"type":"mcq","q":"This is the first time I ___ a British film without subtitles.","options":["have watched","watched","am watching","was watching"],"answer":0,"explain":"\"This is the first time…\" is followed by the present perfect."},{"type":"mcq","q":"I ___ my keys. Can you help me look for them?","options":["lost","'ve lost","had lost","was losing"],"answer":1,"explain":"Past action with a result now (I still can't find them) → present perfect."},{"type":"mcq","q":"When did you ___ in the UK?","options":["arrive","arrived","have arrived","had arrived"],"answer":0,"explain":"Questions with \"when\" ask about a finished time → did + base verb."},{"type":"gap","q":"How long have you ___ (learn) English? I started five years ago.","answer":["been learning"],"explain":"Duration up to now → present perfect continuous: have been learning."},{"type":"mcq","q":"She was nervous because she ___ a job interview in English before.","options":["hadn't had","didn't have","hasn't had","wasn't having"],"answer":0,"explain":"Before a past moment (when she was nervous) → past perfect."},{"type":"mcq","q":"Which sentence is correct?","options":["I have seen him yesterday.","I saw him yesterday.","I had seen him yesterday.","I have been seeing him yesterday."],"answer":1,"explain":"\"Yesterday\" = finished time → past simple."}]},{"id":"g-cond","free":true,"title":"Conditionals","sub":"Zero, first, second, third & mixed","explain":"\u003ctable class=\"rubric\">\u003ctr>\u003cth>Type\u003c/th>\u003cth>Form\u003c/th>\u003cth>Use\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Zero\u003c/td>\u003ctd>If + present, present\u003c/td>\u003ctd>Facts: \u003ci>If you heat ice, it melts.\u003c/i>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>First\u003c/td>\u003ctd>If + present, will + verb\u003c/td>\u003ctd>Real future possibility: \u003ci>If it rains, we'll stay in.\u003c/i>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Second\u003c/td>\u003ctd>If + past, would + verb\u003c/td>\u003ctd>Unreal now/future: \u003ci>If I had more time, I'd volunteer.\u003c/i>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Third\u003c/td>\u003ctd>If + past perfect, would have + pp\u003c/td>\u003ctd>Imagined past: \u003ci>If I'd known, I would have called.\u003c/i>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Mixed\u003c/td>\u003ctd>If + past perfect, would + verb\u003c/td>\u003ctd>Past cause, present result: \u003ci>If I'd studied medicine, I'd be a doctor now.\u003c/i>\u003c/td>\u003c/tr>\u003c/table>\n\u003cp class=\"mt\">\u003cb>unless\u003c/b> = if… not · \u003cb>as long as / provided that\u003c/b> = only if · \u003cb>If I were you…\u003c/b> for advice.\u003c/p>\n\u003cp>Never use \u003ci>will\u003c/i> or \u003ci>would\u003c/i> in the \u003cb>if\u003c/b>-clause: \u003cs>If it will rain…\u003c/s>\u003c/p>","items":[{"type":"mcq","q":"If you heat ice, it ___.","options":["melts","will melt","would melt","melted"],"answer":0,"explain":"General truth → zero conditional."},{"type":"gap","q":"If it rains tomorrow, we ___ (cancel) the picnic.","answer":["will cancel","'ll cancel"],"explain":"Real future possibility → first conditional."},{"type":"mcq","q":"If I ___ more money, I would buy a house.","options":["have","had","would have","will have"],"answer":1,"explain":"Unreal present → second conditional: if + past simple."},{"type":"mcq","q":"If she had left earlier, she ___ the train.","options":["would catch","will catch","would have caught","had caught"],"answer":2,"explain":"Imagined past → third conditional: would have + past participle."},{"type":"gap","q":"If I ___ (be) you, I would apply for the job.","answer":["were","was"],"explain":"\"If I were you\" is the standard phrase for advice (\"was\" is common in speech)."},{"type":"mcq","q":"You won't pass the test ___ you practise every day.","options":["if","unless","provided","when"],"answer":1,"explain":"Unless = if not: you won't pass if you don't practise."},{"type":"mcq","q":"If I had studied medicine, I ___ a doctor now.","options":["would be","would have been","will be","am"],"answer":0,"explain":"Past cause, present result (\"now\") → mixed conditional."},{"type":"mcq","q":"I'll lend you my car ___ you drive carefully.","options":["unless","as long as","even if","in case"],"answer":1,"explain":"As long as = only on the condition that."},{"type":"gap","q":"If they ___ (not/miss) the flight, they would have arrived on time.","answer":["hadn't missed","had not missed"],"explain":"Third conditional: if + past perfect."},{"type":"mcq","q":"What would you do if you ___ a wallet in the street?","options":["find","found","had found","will find"],"answer":1,"explain":"Imaginary situation → second conditional."},{"type":"mcq","q":"If the company had hired more staff last year, we ___ so busy now.","options":["wouldn't be","won't be","wouldn't have been","aren't"],"answer":0,"explain":"Past cause (last year) → present result (now): mixed conditional."},{"type":"gap","q":"Unless you ___ (book) early, you won't get a seat.","answer":["book"],"explain":"After unless/if in the first conditional, use the present simple."}]},{"id":"g-passive","free":true,"title":"The passive","sub":"Formal writing, all tenses, have something done","explain":"\u003cp>Form: \u003cb>be + past participle\u003c/b>. Use the passive when the action matters more than who does it, when the doer is unknown or obvious, and in formal writing.\u003c/p>\n\u003cul>\u003cli>Present: The forms \u003cb>are checked\u003c/b> by staff.\u003c/li>\u003cli>Past: The bridge \u003cb>was built\u003c/b> in 1890.\u003c/li>\u003cli>Present perfect: Thousands of homes \u003cb>have been sold\u003c/b>.\u003c/li>\u003cli>Continuous: The road \u003cb>is being repaired\u003c/b>.\u003c/li>\u003cli>Future/modal: Results \u003cb>will be sent\u003c/b> by email. Forms \u003cb>must be signed\u003c/b>.\u003c/li>\u003c/ul>\n\u003cp>Add the doer with \u003cb>by\u003c/b> only if it is important: \u003ci>The report was written \u003cb>by\u003c/b> an independent expert.\u003c/i>\u003c/p>\n\u003cp>\u003cb>It is said / believed / expected that…\u003c/b> — very useful in essays: \u003ci>It is expected that prices will rise.\u003c/i>\u003c/p>\n\u003cp>\u003cb>have/get something done\u003c/b> (someone does it for you): \u003ci>I had my eyes tested.\u003c/i>\u003c/p>","items":[{"type":"gap","q":"English ___ (speak) in many countries.","answer":["is spoken"],"explain":"Present simple passive: is + spoken."},{"type":"mcq","q":"The new hospital ___ next year.","options":["will build","will be built","is building","builds"],"answer":1,"explain":"The hospital doesn't build itself → future passive."},{"type":"mcq","q":"My car ___ at the moment, so I'm taking the bus.","options":["is repaired","is being repaired","has repaired","repairs"],"answer":1,"explain":"\"At the moment\" → present continuous passive: is being + pp."},{"type":"gap","q":"The results ___ (announce) yesterday.","answer":["were announced"],"explain":"Past simple passive with a plural subject: were + pp."},{"type":"mcq","q":"All visa applications must ___ online.","options":["complete","be completed","been completed","completing"],"answer":1,"explain":"Modal + be + past participle."},{"type":"mcq","q":"The thief ___ by the police last night.","options":["arrested","was arrested","has arrested","is arrested"],"answer":1,"explain":"Past passive: was + pp."},{"type":"gap","q":"Over a million people ___ (vaccinate) so far this year.","answer":["have been vaccinated"],"explain":"\"So far\" → present perfect passive: have been + pp."},{"type":"mcq","q":"I'm going to have my hair ___ tomorrow.","options":["cut","cutting","to cut","be cut"],"answer":0,"explain":"have + object + past participle (someone does it for you)."},{"type":"mcq","q":"It ___ that the economy will grow next year.","options":["is expected","expects","is expecting","has expected"],"answer":0,"explain":"Impersonal passive: It is expected that…"},{"type":"mcq","q":"The bridge ___ when the earthquake happened.","options":["was being built","was building","built","has been built"],"answer":0,"explain":"An action in progress in the past → past continuous passive."},{"type":"gap","q":"The documents should ___ (send) by Friday.","answer":["be sent"],"explain":"Modal + be + past participle."},{"type":"mcq","q":"Which is the passive form of \"Someone stole my bike\"?","options":["My bike was stolen.","My bike stole.","My bike has stolen.","My bike was stealing."],"answer":0,"explain":"The object (my bike) becomes the subject: was + stolen."}]},{"id":"g-reported","title":"Reported speech","sub":"Statements, questions, commands, reporting verbs","locked":true},{"id":"g-relative","title":"Relative clauses","sub":"who, which, that, whose, where, when","locked":true},{"id":"g-modals","title":"Modal verbs","sub":"Deduction, obligation, advice & regret","locked":true},{"id":"g-wish","title":"Wishes & regrets","sub":"wish, if only, would rather, it's time","locked":true},{"id":"g-gerinf","title":"Gerunds & infinitives","sub":"-ing or to? Verbs that change meaning","locked":true},{"id":"g-linkers","title":"Linking & contrast","sub":"although, despite, however, whereas, due to…","locked":true},{"id":"g-future","title":"Future forms","sub":"will, going to, continuous, future perfect","locked":true},{"id":"g-articles","title":"Articles & quantifiers","sub":"a/an/the/no article, much/many, few/little","locked":true},{"id":"g-prep","title":"Prepositions & collocations","sub":"depend on, apply for, interested in…","locked":true}],"vocab":[{"id":"v-work","topic":"Work & careers","free":true,"words":[{"w":"redundancy","pos":"noun","def":"losing your job because your employer no longer needs your position","ex":"Hundreds of staff faced redundancy when the factory closed.","id":"v-work:redundancy"},{"w":"probation period","pos":"noun","def":"a trial period at the start of a new job","ex":"My probation period lasts six months, then my contract becomes permanent.","id":"v-work:probation-period"},{"w":"promotion","pos":"noun","def":"a move to a more senior position at work","ex":"She got a promotion to team leader after two years.","id":"v-work:promotion"},{"w":"shift","pos":"noun","def":"a fixed period of work, especially in hospitals, factories and shops","ex":"I'm on the night shift all this week.","id":"v-work:shift"},{"w":"overtime","pos":"noun","def":"extra hours worked beyond your normal hours","ex":"We get paid time and a half for overtime at the weekend.","id":"v-work:overtime"},{"w":"colleague","pos":"noun","def":"a person you work with","ex":"My colleagues helped me settle in during my first week.","id":"v-work:colleague"},{"w":"deadline","pos":"noun","def":"the time or date by which something must be finished","ex":"The deadline for the report is Friday at 5 pm.","id":"v-work:deadline"},{"w":"salary","pos":"noun","def":"the fixed amount of money you are paid for a job, usually per year","ex":"The position offers a starting salary of £32,000.","id":"v-work:salary"},{"w":"resign","pos":"verb","def":"to officially leave your job","ex":"He resigned so that he could start his own business.","id":"v-work:resign"},{"w":"be in charge of","pos":"phrase","def":"to be responsible for people or an activity","ex":"She's in charge of a team of twelve nurses.","id":"v-work:be-in-charge-of"},{"w":"workload","pos":"noun","def":"the amount of work a person has to do","ex":"My workload has doubled since my colleague left.","id":"v-work:workload"},{"w":"apply for","pos":"phrasal verb","def":"to formally ask for a job, place or document","ex":"I applied for three jobs last week.","id":"v-work:apply-for"},{"w":"reference","pos":"noun","def":"a statement from a previous employer about your ability and character","ex":"My old manager wrote me an excellent reference.","id":"v-work:reference"},{"w":"flexible working","pos":"noun","def":"an arrangement that lets you change when or where you work","ex":"The company offers flexible working to parents of young children.","id":"v-work:flexible-working"},{"w":"sponsor","pos":"noun","def":"an employer licensed by the Home Office to hire workers from overseas","ex":"You need a job offer from a licensed sponsor to get a Skilled Worker visa.","id":"v-work:sponsor"},{"w":"qualification","pos":"noun","def":"an official record that you have passed a course or exam","ex":"Her nursing qualification is recognised in the UK.","id":"v-work:qualification"},{"w":"take on","pos":"phrasal verb","def":"to employ someone; to accept work or responsibility","ex":"The hotel is taking on extra staff for the summer.","id":"v-work:take-on"},{"w":"job satisfaction","pos":"noun","def":"the feeling of enjoying your work and finding it worthwhile","ex":"Many carers say the job satisfaction makes up for the low pay.","id":"v-work:job-satisfaction"},{"w":"annual leave","pos":"noun","def":"paid holiday from work","ex":"Full-time workers in the UK are entitled to at least 28 days' annual leave a year.","id":"v-work:annual-leave"},{"w":"get on with","pos":"phrasal verb","def":"to have a friendly relationship with someone","ex":"I get on really well with my line manager.","id":"v-work:get-on-with"}]},{"id":"v-housing","topic":"Housing & living in the UK","free":true,"words":[{"w":"landlord","pos":"noun","def":"a person or company that owns a property and rents it to others","ex":"Our landlord fixed the leaking tap within a day.","id":"v-housing:landlord"},{"w":"tenant","pos":"noun","def":"a person who rents a home from a landlord","ex":"Tenants have the right to live in a safe property.","id":"v-housing:tenant"},{"w":"deposit","pos":"noun","def":"money paid at the start of a tenancy and returned at the end if there is no damage","ex":"We got our whole deposit back when we moved out.","id":"v-housing:deposit"},{"w":"tenancy agreement","pos":"noun","def":"the written contract between a landlord and a tenant","ex":"Read your tenancy agreement carefully before you sign it.","id":"v-housing:tenancy-agreement"},{"w":"letting agent","pos":"noun","def":"a company that finds tenants and manages homes for landlords","ex":"The letting agent arranged a viewing for Saturday.","id":"v-housing:letting-agent"},{"w":"utility bills","pos":"noun","def":"bills for gas, electricity and water","ex":"Utility bills have risen sharply this winter.","id":"v-housing:utility-bills"},{"w":"council tax","pos":"noun","def":"a tax paid by households to the local council for local services","ex":"Students in full-time education usually don't pay council tax.","id":"v-housing:council-tax"},{"w":"move in","pos":"phrasal verb","def":"to start living in a new home","ex":"We moved in on the first of the month.","id":"v-housing:move-in"},{"w":"furnished","pos":"adjective","def":"with furniture already provided","ex":"The flat is fully furnished, so you only need to bring your clothes.","id":"v-housing:furnished"},{"w":"flatmate","pos":"noun","def":"a person you share a flat with","ex":"My flatmate and I take turns to do the cleaning.","id":"v-housing:flatmate"},{"w":"neighbourhood","pos":"noun","def":"the area around where you live","ex":"It's a quiet, friendly neighbourhood with a good school.","id":"v-housing:neighbourhood"},{"w":"commute","pos":"noun / verb","def":"the regular journey between home and work","ex":"My commute takes forty minutes each way by train.","id":"v-housing:commute"},{"w":"damp","pos":"adjective / noun","def":"slightly wet, often causing mould on walls","ex":"The bedroom is damp, so I've asked the landlord to look at it.","id":"v-housing:damp"},{"w":"mortgage","pos":"noun","def":"a loan from a bank to buy a house or flat","ex":"They took out a 25-year mortgage on their first home.","id":"v-housing:mortgage"},{"w":"evict","pos":"verb","def":"to legally force someone to leave the home they rent","ex":"A landlord must follow the correct legal process to evict a tenant.","id":"v-housing:evict"},{"w":"maintenance","pos":"noun","def":"work done to keep a building or equipment in good condition","ex":"The landlord is responsible for the maintenance of the boiler.","id":"v-housing:maintenance"},{"w":"semi-detached","pos":"adjective","def":"(of a house) joined to one other house on one side","ex":"They live in a three-bedroom semi-detached house.","id":"v-housing:semi-detached"},{"w":"overcrowded","pos":"adjective","def":"with too many people for the space available","ex":"Some families live in overcrowded flats because rents are so high.","id":"v-housing:overcrowded"},{"w":"affordable","pos":"adjective","def":"cheap enough for ordinary people to pay for","ex":"There is a shortage of affordable housing in big cities.","id":"v-housing:affordable"},{"w":"viewing","pos":"noun","def":"a visit to see a property you might rent or buy","ex":"Good flats often go after the first viewing.","id":"v-housing:viewing"}]},{"id":"v-health","topic":"Health & wellbeing","count":20,"locked":true},{"id":"v-tech","topic":"Technology & the internet","count":20,"locked":true},{"id":"v-env","topic":"The environment","count":20,"locked":true},{"id":"v-edu","topic":"Education & training","count":20,"locked":true},{"id":"v-money","topic":"Money & shopping","count":20,"locked":true},{"id":"v-travel","topic":"Travel & transport","count":20,"locked":true},{"id":"v-society","topic":"Society & community","count":20,"locked":true},{"id":"v-media","topic":"Media & communication","count":20,"locked":true},{"id":"v-feelings","topic":"Personality & feelings","count":20,"locked":true},{"id":"v-academic","topic":"Essay & academic words","count":20,"locked":true}],"writing":[{"id":"w1","free":true,"type":"email","formality":"formal","minWords":150,"time":20,"plan":["Choose the right greeting and sign-off for the person you are writing to.","Opening paragraph: say why you are writing in one or two sentences.","One paragraph for each bullet point in the task.","Closing paragraph: say what you want to happen next.","Check tenses, articles and spelling in the last two minutes."],"title":"Complaint about an online order","prompt":"You ordered a coffee machine from an online shop. It arrived a week late and does not work properly.\n\nWrite an email to the shop. In your email:","bullets":["give details of your order","describe the problems","say what you would like the shop to do"],"model":"Dear Sir or Madam,\n\nI am writing to complain about a coffee machine that I ordered from your website on 2 March (order number 48213).\n\nAccording to your website, delivery would take three to five working days. However, the machine did not arrive until 14 March, more than a week later than promised. I had specifically chosen your shop because of its fast delivery, so this was very disappointing.\n\nTo make matters worse, the machine does not work properly. Although it switches on, the water does not heat up, and it leaks onto the kitchen counter every time I use it. I have followed the instructions in the manual carefully, so I am confident that the fault is not caused by incorrect use.\n\nI would therefore like you to arrange for the machine to be collected and to provide a full refund, including the delivery charge of £4.99. I would be grateful if you could reply within seven days.\n\nYours faithfully,\n\nAmara Mensah","notes":"\"Dear Sir or Madam\" → \"Yours faithfully\". Each bullet has its own paragraph. Useful complaint language: \"To make matters worse\", \"I am confident that\", \"I would be grateful if…\". Specific details (dates, order number, price) make the complaint convincing."},{"id":"w2","free":true,"type":"essay","formality":"formal","minWords":250,"time":40,"plan":["Spend 3–5 minutes planning: note two main ideas with a reason and an example each.","Introduction: paraphrase the question and give your position clearly.","Body paragraphs: one main idea each — topic sentence, explanation, example.","Conclusion: summarise and repeat your opinion in different words. No new ideas.","Leave 3 minutes to check grammar, spelling and word count."],"title":"Opinion essay: working from home","prompt":"Some people think that employees should be allowed to work from home whenever they want.\n\nTo what extent do you agree or disagree?\n\nGive reasons for your answer and include relevant examples from your own knowledge or experience.","model":"Since the pandemic, working from home has become normal for millions of office workers, and many now expect complete freedom to choose where they work. While I agree that flexibility is valuable, I do not believe employees should be allowed to work from home whenever they want.\n\nThere are clear benefits to remote work. Employees save the time and money they would otherwise spend commuting, which can improve both their wellbeing and their productivity. Parents, in particular, find it easier to balance work with childcare. Furthermore, companies can reduce the cost of renting large offices. For these reasons, it makes sense for many organisations to offer some days at home.\n\nHowever, unlimited home working creates significant problems. Firstly, teamwork suffers when colleagues rarely meet. Many ideas come from informal conversations, and these are difficult to recreate on video calls. Secondly, new and younger employees learn a great deal by watching experienced colleagues, so they may develop more slowly if everyone is at home. Finally, some roles simply require physical presence; a nurse or a mechanic cannot work from their kitchen, and allowing total freedom to some staff may create resentment among others.\n\nIn my view, the best solution is a hybrid arrangement in which teams agree on certain days in the office and allow home working for the rest of the week. This approach keeps most of the advantages of flexibility while protecting collaboration and training.\n\nIn conclusion, although working from home brings real benefits, giving employees complete choice is not practical. A balanced, agreed system is fairer for both workers and employers.","notes":"The position (\"I do not believe…\") is clear from the introduction. The writer acknowledges the other side first, then argues against it with three ordered points (Firstly, Secondly, Finally), and offers a solution before concluding."},{"id":"w3","title":"Asking your landlord for permission","type":"email","formality":"semi","locked":true},{"id":"w4","title":"Discussion essay: when children should learn a language","type":"essay","formality":"formal","locked":true},{"id":"w5","title":"Advice for a friend moving to the UK","type":"email","formality":"informal","locked":true},{"id":"w6","title":"Advantages and disadvantages: living in big cities","type":"essay","formality":"formal","locked":true},{"id":"w7","title":"Requesting a change to your working hours","type":"email","formality":"formal","locked":true},{"id":"w8","title":"Problem and solution: affordable housing","type":"essay","formality":"formal","locked":true},{"id":"w9","title":"Enquiry about an evening course","type":"email","formality":"formal","locked":true},{"id":"w10","title":"Opinion essay: technology and social life","type":"essay","formality":"formal","locked":true},{"id":"w11","title":"Thanking a friend and inviting them","type":"email","formality":"informal","locked":true},{"id":"w12","title":"Discussion essay: public transport or roads?","type":"essay","formality":"formal","locked":true}],"speaking":{"part1":[{"id":"p1-work","free":true,"part":1,"topic":"Work and study","qs":["Do you work or are you a student?","Why did you choose this job or subj
