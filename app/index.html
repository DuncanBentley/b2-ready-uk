ect?","What is the most difficult part of your work or studies?","Would you like to change your job in the future?","Do you prefer working alone or in a team?"],"models":["I work full-time as a staff nurse on a surgical ward at a hospital in Leicester. I've been there for about eighteen months now, and before that I worked in a private hospital back home.","I chose nursing because I've always wanted a job where I can help people directly. My aunt is a nurse, and when I was a teenager I used to hear her stories, so I suppose she inspired me.","Probably the shift patterns. Working nights can be really exhausting, and it's hard to keep a normal sleep routine. But you get used to it, and the team is very supportive.","Not completely, but I'd like to specialise in the future, maybe in intensive care. I think it would be challenging, but it would also give me more responsibility.","It depends on the task, but generally I prefer working in a team. You learn a lot from your colleagues, and in a hospital you simply can't do everything on your own."]},{"id":"p1-home","free":true,"part":1,"topic":"Your home","qs":["Do you live in a house or a flat?","What is your favourite room in your home? Why?","Is there anything you would like to change about your home?","Do you plan to live there for a long time?","What do you usually do at home in the evenings?"],"models":["I live in a two-bedroom flat on the third floor of a modern building, which I share with my wife and our young son.","Definitely the living room, because it has a big window and gets a lot of light, even in winter. It's where we spend most of our time together as a family.","I'd love a bit more storage space. With a small child, there are toys everywhere! A garden would be nice too, but that's not really possible in a flat.","Probably not. It's fine for now, but once our son starts school, we'd like to move somewhere with a garden and a bit more space.","Usually I cook dinner, and then once our son is asleep, we watch a series or I study for an hour or so. It's quite a quiet routine, to be honest."]},{"id":"p1-town","topic":"Your home town","part":1,"locked":true},{"id":"p1-free","topic":"Free time","part":1,"locked":true},{"id":"p1-food","topic":"Food and cooking","part":1,"locked":true},{"id":"p1-transport","topic":"Transport","part":1,"locked":true},{"id":"p1-weather","topic":"Weather and seasons","part":1,"locked":true},{"id":"p1-shopping","topic":"Shopping","part":1,"locked":true},{"id":"p1-tech","topic":"Phones and the internet","part":1,"locked":true},{"id":"p1-friends","topic":"Friends and neighbours","part":1,"locked":true}],"cards":[{"id":"c1","free":true,"title":"Describe a skill you learned as an adult.","bullets":["what the skill is","how and where you learned it","how long it took you to learn","and explain how this skill has helped you"],"followups":["Do you think it is harder to learn new skills as an adult?","Is there another skill you would like to learn?"],"vocab":["pick up (a skill)","self-taught","a steep learning curve","get the hang of it","trial and error","gain confidence","transferable skills"],"model":"I'd like to talk about learning to drive, which I did when I was twenty-six, so quite late compared to most people.\n\nI'd always lived in a big city with good public transport, so I never really needed a car. But when I got a job on the other side of the city, the journey took nearly two hours by bus, so I decided it was time to learn.\n\nI took lessons with a driving instructor twice a week for about four months. To be honest, it was much harder than I expected. At first I found it really stressful to concentrate on the road, the mirrors and the other drivers all at the same time, and I failed my first test because I didn't check my mirror before changing lanes. That was embarrassing, but I learned from it.\n\nI passed on my second attempt, and it has helped me enormously. My commute is now forty minutes, so I have more time with my family. It also made me more confident in general, because it showed me that I can still learn something completely new as an adult."},{"id":"c2","free":true,"title":"Describe a place in your town or city that you enjoy visiting.","bullets":["where it is","what you can do there","how often you go there","and explain why you enjoy going there"],"followups":["Do you prefer going there alone or with other people?","Has the place changed since you first went there?"],"vocab":["tucked away","within walking distance","peaceful atmosphere","a hidden gem","recharge my batteries","packed with tourists","well looked after"],"model":"The place I'd like to describe is a small park near the river in the city where I live. It's about ten minutes' walk from my flat, tucked away behind some office buildings, so a lot of people don't even know it exists.\n\nThere isn't a huge amount to do there, which is actually what I like about it. There's a path along the water where people go jogging, a few benches under some old trees, and a little kiosk that sells coffee and snacks. In the summer, local musicians sometimes play there at the weekend.\n\nI usually go there two or three times a week, normally after work or on Sunday mornings when it's really quiet.\n\nThe main reason I enjoy it is that it helps me switch off. My job is quite stressful and I spend most of the day in front of a screen, so sitting by the river for half an hour really helps me recharge my batteries. It also reminds me of my home town, which is also on a river, so in a way it makes me feel less homesick."},{"id":"c3","title":"Describe an important decision you made.","locked":true},{"id":"c4","title":"Describe a person who helped you when you needed it.","locked":true},{"id":"c5","title":"Describe a journey that took longer than you expected.","locked":true},{"id":"c6","title":"Describe a piece of technology you use every day.","locked":true},{"id":"c7","title":"Describe a time when you had to learn something quickly.","locked":true},{"id":"c8","title":"Describe a celebration or festival that is important in your country.","locked":true},{"id":"c9","title":"Describe a book, film or TV series that you enjoyed.","locked":true},{"id":"c10","title":"Describe a job you would like to do in the future.","locked":true},{"id":"c11","title":"Describe a time when you helped someone.","locked":true},{"id":"c12","title":"Describe a goal you hope to achieve in the next five years.","locked":true},{"id":"c13","title":"Describe a problem you had and how you solved it.","locked":true},{"id":"c14","title":"Describe a change you would like to make in your local area.","locked":true}],"part3":[{"id":"p3-work","free":true,"part":3,"topic":"Work and careers","qs":["Why do some people change careers later in life?","Is job satisfaction more important than a high salary?","How might artificial intelligence change the jobs people do?","Should companies be responsible for training their staff?"],"models":["I think there are a few main reasons. Some people realise that the career they chose when they were young doesn't really suit them any more, perhaps because their priorities have changed after having children. Others are forced to change because their industry is declining, for example because of automation. And for some, it's simply about wanting a new challenge. People are working until they're much older now, so changing career at forty or fifty isn't as risky as it used to be.","In my opinion, job satisfaction is more important, but only up to a point. If you don't earn enough to pay your bills, you'll be stressed no matter how much you enjoy your work. But once you have a reasonable salary, I think enjoying what you do makes a much bigger difference to your quality of life than earning a bit more. I know people with very well-paid jobs who are quite miserable."]},{"id":"p3-education","free":true,"part":3,"topic":"Education and learning","qs":["Is it better to learn in a classroom or online?","Why do some adults find it difficult to learn new skills?","Should university education be free?","How has technology changed the way people learn?"],"models":["It depends on the person and what they're learning. Online learning is very convenient, especially for adults with jobs and families, because you can study whenever you like. On the other hand, it requires a lot of self-discipline, and you miss out on the interaction with teachers and classmates. For practical skills, like nursing or engineering, I think face-to-face teaching is still essential. So, ideally, a mix of the two works best.","I think one reason is time. Adults have so many responsibilities that it's hard to practise regularly. Another reason is confidence. Children aren't afraid of making mistakes, whereas adults often feel embarrassed, so they avoid situations where they might look foolish. That said, adults have some advantages too, like better concentration and a clearer idea of why they want to learn."]},{"id":"p3-tech","topic":"Technology and society","part":3,"locked":true},{"id":"p3-env","topic":"The environment","part":3,"locked":true},{"id":"p3-cities","topic":"Cities and housing","part":3,"locked":true},{"id":"p3-health","topic":"Health and lifestyle","part":3,"locked":true},{"id":"p3-media","topic":"News and media","part":3,"locked":true},{"id":"p3-family","topic":"Family and community","part":3,"locked":true}]},"phrases":[{"group":"Formal emails: opening & closing","free":true,"note":"Use when writing to a company, manager, landlord, council or someone you don't know.","items":["Dear Mr Khan, / Dear Ms Lewis, (you know the name → end \"Yours sincerely,\")","Dear Sir or Madam, (you don't know the name → end \"Yours faithfully,\")","I am writing to complain about…","I am writing to enquire about…","I am writing with regard to your advertisement for…","Following our telephone conversation on Monday, …","I would be grateful if you could…","I would appreciate it if you could let me know…","Please find attached…","I look forward to hearing from you.","Thank you in advance for your help.","Should you require any further information, please do not hesitate to contact me."]},{"group":"Informal emails: opening & closing","count":10,"locked":true},{"group":"Giving your opinion","free":true,"items":["In my opinion, … / In my view, …","Personally, I believe that…","I strongly feel that…","It seems to me that…","From my point of view, …","As far as I'm concerned, …","I'm convinced that…","I tend to think that…","There is no doubt that…","It could be argued that… (more neutral, good for essays)"]},{"group":"Agreeing & disagreeing politely","count":10,"locked":true},{"group":"Adding & contrasting ideas","count":10,"locked":true},{"group":"Cause & effect","count":10,"locked":true},{"group":"Giving examples","count":10,"locked":true},{"group":"Concluding","count":10,"locked":true},{"group":"Speaking: buying time","free":true,"note":"Use these instead of \"um\" or silence. Examiners see them as natural, fluent language.","items":["That's an interesting question…","Let me think about that for a moment.","I've never really thought about that before, but…","Well, it depends on…","How can I put this?","That's a difficult one, but I'd say…","To be honest, …","I suppose the main thing is…","Off the top of my head, …","What I mean is…"]},{"group":"Speaking: speculating about the future","count":10,"locked":true},{"group":"Describing trends & comparing (charts)","count":10,"locked":true},{"group":"Complaining & requesting politely","count":10,"locked":true},{"group":"Clarifying & paraphrasing","count":10,"locked":true}],"exams":[{"id":"ielts","short":"IELTS for UKVI","name":"IELTS for UKVI (Academic or General Training)","provider":"IELTS SELT Consortium","where":"In the UK and worldwide","b2":"5.5 in each skill","url":"https://ielts.org","format":"Four papers: Listening (about 30 minutes, 4 recordings), Reading (60 minutes, 3 long texts), Writing (60 minutes, 2 tasks — a letter in General Training or a chart/graph description in Academic, plus a 250-word essay) and a face-to-face Speaking test of 11–14 minutes in 3 parts. Available on paper or computer. You must book the \"for UKVI\" version — the standard IELTS test is not on the approved list.","tips":["You need 5.5 in each of the four skills — an overall 6.5 with a 5.0 in Writing is not enough.","Writing Task 2 is worth more than Task 1: spend about 40 minutes on it.","In Speaking Part 2, use the full minute to plan and keep talking until the examiner stops you.","Reading answers must be spelled correctly and stay within the word limit."]},{"id":"pte","short":"PTE Academic UKVI","name":"PTE Academic UKVI","provider":"Pearson","where":"In the UK and worldwide","b2":"59 in each skill","url":"https://www.pearsonpte.com","format":"A computer-based test of about 2 hours, scored by computer. Speaking and Writing are tested together first (read aloud, repeat sentence, describe image, re-tell lecture, summarise written text, essay), then Reading (fill in the blanks, re-order paragraphs, multiple choice) and Listening (summarise spoken text, fill in the blanks, highlight incorrect words, write from dictation). Many tasks test two skills at once.","tips":["You need 59 in each communicative skill: Listening, Reading, Speaking and Writing.","Speak smoothly and at a steady pace — fluency and pronunciation are scored by computer, so long pauses hurt.","Integrated tasks feed several scores: write-from-dictation helps both Listening and Writing.","Practise typing: spelling and grammar in your typed answers count."]},{"id":"lcert","short":"LanguageCert SELT","name":"LanguageCert Academic SELT / General SELT","provider":"LanguageCert","where":"In the UK and worldwide","b2":"60 in each skill","url":"https://www.languagecert.org","format":"A four-skill test (Listening, Reading, Writing and Speaking) with each skill scored separately. The Academic SELT uses study-related topics; the General SELT uses everyday and work topics. Speaking is assessed in a separate test with an examiner. These replaced the LanguageCert International ESOL SELT 4-skills test from 6 July 2025; results from the older test (B2 = 33/50 in each skill) stay valid for two years. Check LanguageCert for current timings.","tips":["B2 requires a score of 60 in each of the four skills.","Choose General SELT if you are more comfortable with everyday topics than academic ones.","In Speaking, develop answers with reasons and examples rather than short replies.","Watch your time in Writing: plan for two to three minutes before you start."]},{"id":"trinity","short":"Trinity ISE II","name":"Trinity Integrated Skills in English II (ISE II)","provider":"Trinity College London","where":"In the UK only","b2":"Pass in each of the 4 skills","url":"https://www.trinitycollege.com","format":"Two modules. Reading & Writing (about 2 hours): long reading, multi-text reading, reading into writing and extended writing. Speaking & Listening (about 20 minutes with an examiner): a topic you prepare in advance, a collaborative task, a conversation and an independent listening task.","tips":["ISE II is the B2 level; ISE I is only B1 — make sure you book ISE II.","You choose and prepare your own topic for the Speaking & Listening module — rehearse it but do not memorise a script.","Reading-into-writing tasks reward summarising in your own words, not copying.","Available only at approved centres in the UK."]},{"id":"psi","short":"Skills for English UKVI","name":"Skills for English UKVI — B2 (4 components)","provider":"PSI Services (UK) Ltd","where":"Outside the UK only","b2":"Pass in each of the 4 skills","url":"https://www.skillsforenglish.com","format":"A four-component test of Reading, Writing, Listening and Speaking, taken at the B2 level at a PSI test centre outside the UK. Check the PSI website for the current format and timings.","tips":["Book the B2 four-component test — the two-component versions only cover speaking and listening and are not enough for B2 routes.","You must pass all four components.","Practise all four skills, not just speaking.","Only available outside the UK."]}],"guide":{"intro":"From 8 January 2026, people applying for a Skilled Worker, Scale-up or High Potential Individual visa for the first time must prove English at level B2 of the Common European Framework of Reference (CEFR) — up from B1. Most people do this with a Secure English Language Test (SELT) from an approved provider, covering reading, writing, speaking and listening.","checkNote":"Rules change. Always confirm the level you need for your exact route on GOV.UK before booking.","officialUrl":"https://www.gov.uk/guidance/prove-your-english-language-abilities-with-a-secure-english-language-test-selt","who":["First-time Skilled Worker visa applicants (applications made on or after 8 January 2026).","Scale-up and High Potential Individual (HPI) visa applicants.","People who already held Skilled Worker, Scale-up or HPI permission before 8 January 2026 can usually still extend at B1.","Settlement (indefinite leave to remain) on many routes is scheduled to move from B1 to B2 for applications made from 26 March 2027.","Students: degree-level study already requires B2."],"tableNote":"Source: GOV.UK lists of approved Secure English Language Tests (in the UK and outside the UK). IELTS Life Skills, PTE Home and the two-component Skills for English tests only go up to B1 (speaking and listening), so they cannot be used where B2 is required. Results must normally be less than 2 years old when you apply.","canDo":[{"skill":"Reading","text":"You can understand articles and reports about current issues, including texts where the writer gives a particular point of view, and you can read mostly without a dictionary."},{"skill":"Listening","text":"You can follow longer talks, discussions and announcements on familiar topics, and understand most radio and TV news spoken at normal speed."},{"skill":"Writing","text":"You can write clear, detailed texts: emails that explain a situation and request action, and essays that give reasons for and against an opinion."},{"skill":"Speaking","text":"You can take part in conversations fluently enough to talk with native speakers without strain, explain your opinion and support it with reasons and examples."}],"checklist":["Check the level you need for your route on GOV.UK.","Choose a test from the approved SELT list, and book the correct version (for example IELTS for UKVI, not standard IELTS; ISE II, not ISE I).","Book at an approved test centre — the GOV.UK lists show the approved centres in and outside the UK.","Use the same ID document you will use for your visa application. Your name must match exactly.","Book early: popular centres fill up and you need time for results to come back.","You must reach B2 in each of the four skills, all with the same provider.","Keep your SELT unique reference number — you will need it in your visa application.","Make sure your result will still be less than 2 years old on the day you apply."],"exempt":["Nationals of certain majority English-speaking countries (for example Australia, Canada, Jamaica, New Zealand and the USA) do not need to prove their English. GOV.UK has the full list.","You may not need a test if you have a degree taught in English that is recognised as equivalent to a UK bachelor's degree or higher (usually confirmed through Ecctis).","A GCSE, A level, Scottish National 4 or 5, Higher or Advanced Higher in English, gained at a UK school you started before age 18, can also count.","If you proved English at the required level in a previous successful visa application, you may not need to prove it again."]},"plan":[{"day":1,"title":"Know your test & take a diagnostic","tasks":[{"t":"Read the B2 test guide and choose your test","href":"#/guide"},{"t":"Mock Test 1: Reading (35 min)","href":"#/mock/m1/reading"},{"t":"Flashcards: Work & careers","href":"#/vocab/v-work/cards"}]},{"day":2,"title":"Listening baseline","tasks":[{"t":"Mock Test 1: Listening","href":"#/mock/m1/listening"},{"t":"Grammar: Perfect tenses","href":"#/grammar/g-tenses"},{"t":"Quiz: Work & careers","href":"#/vocab/v-work/quiz"}]},{"day":3,"title":"Writing baseline","tasks":[{"t":"Mock Test 1: Writing","href":"#/mock/m1/writing"},{"t":"Phrase bank: formal emails","href":"#/phrases"}]},{"day":4,"title":"Speaking baseline","tasks":[{"t":"Mock Test 1: Speaking","href":"#/mock/m1/speaking"},{"t":"Phrase bank: buying time","href":"#/phrases"},{"t":"Review your Mock 1 results","href":"#/mock/m1/results"}]},{"day":5,"title":"Conditionals & housing","tasks":[{"t":"Grammar: Conditionals","href":"#/grammar/g-cond"},{"t":"Flashcards: Housing & living in the UK","href":"#/vocab/v-housing/cards"},{"t":"Reading: Mock 2, Text 1","href":"#/practice/reading/m2r1"}]},{"day":6,"title":"Emails & cue cards","tasks":[{"t":"Writing: formal email of complaint","href":"#/writing/w1"},{"t":"Speaking: cue card — a skill you learned","href":"#/speaking/c1"}]},{"day":7,"title":"Review week 1","tasks":[{"t":"Grammar: The passive","href":"#/grammar/g-passive"},{"t":"Redo any Mock 1 section below 60%","href":"#/mock/m1"},{"t":"Flashcards: anything due","href":"#/vocab"}]},{"day":8,"title":"Reading for detail","tasks":[{"t":"Reading: Mock 2, Text 2","href":"#/practice/reading/m2r2"},{"t":"Reading: Mock 2, Text 3","href":"#/practice/reading/m2r3"},{"t":"Grammar: Relative clauses","href":"#/grammar/g-relative"}]},{"day":9,"title":"Listening for paraphrase","tasks":[{"t":"Mock Test 2: Listening","href":"#/mock/m2/listening"},{"t":"Flashcards: Health & wellbeing","href":"#/vocab/v-health/cards"}]},{"day":10,"title":"Opinion essays","tasks":[{"t":"Writing: opinion essay — working from home","href":"#/writing/w2"},{"t":"Phrase bank: giving opinions, concluding","href":"#/phrases"}]},{"day":11,"title":"Speaking Part 1","tasks":[{"t":"Speaking: interview — work and study","href":"#/speaking/p1-work"},{"t":"Grammar: Reported speech","href":"#/grammar/g-reported"}]},{"day":12,"title":"Mock 2 productive skills","tasks":[{"t":"Mock Test 2: Writing","href":"#/mock/m2/writing"},{"t":"Mock Test 2: Speaking","href":"#/mock/m2/speaking"}]},{"day":13,"title":"Modals & technology","tasks":[{"t":"Grammar: Modal verbs","href":"#/grammar/g-modals"},{"t":"Flashcards: Technology & the internet","href":"#/vocab/v-tech/cards"},{"t":"Mock Test 2: Reading","href":"#/mock/m2/reading"}]},{"day":14,"title":"Review week 2","tasks":[{"t":"Check your Mock 2 results","href":"#/mock/m2/results"},{"t":"Speaking: cue card — a place in your city","href":"#/speaking/c2"}]},{"day":15,"title":"Mock 3: receptive skills","tasks":[{"t":"Mock Test 3: Reading","href":"#/mock/m3/reading"},{"t":"Mock Test 3: Listening","href":"#/mock/m3/listening"}]},{"day":16,"title":"Formal requests","tasks":[{"t":"Writing: email to a landlord","href":"#/writing/w3"},{"t":"Grammar: Linking & contrast","href":"#/grammar/g-linkers"}]},{"day":17,"title":"Long turns","tasks":[{"t":"Speaking: cue card — a decision you made","href":"#/speaking/c3"},{"t":"Speaking: cue card — a helpful person","href":"#/speaking/c4"},{"t":"Flashcards: Environment","href":"#/vocab/v-env/cards"}]},{"day":18,"title":"Discussion essays","tasks":[{"t":"Writing: discussion essay","href":"#/writing/w4"},{"t":"Grammar: Gerunds & infinitives","href":"#/grammar/g-gerinf"}]},{"day":19,"title":"Speaking Part 3","tasks":[{"t":"Speaking: discussion — technology and society","href":"#/speaking/p3-tech"},{"t":"Flashcards: Education & training","href":"#/vocab/v-edu/cards"}]},{"day":20,"title":"Mock 3: productive skills","tasks":[{"t":"Mock Test 3: Writing","href":"#/mock/m3/writing"},{"t":"Mock Test 3: Speaking","href":"#/mock/m3/speaking"}]},{"day":21,"title":"Review week 3","tasks":[{"t":"Grammar: Wishes & regrets","href":"#/grammar/g-wish"},{"t":"Check your Mock 3 results","href":"#/mock/m3/results"}]},{"day":22,"title":"Mock 4 rehearsal (part 1)","tasks":[{"t":"Mock Test 4: Reading","href":     const contractions = task.formality !== 'informal' ? [...new Set((clean.match(CONTRACTIONS) || []).map(s => s.toLowerCase()))] : [];
    const lowerI = (clean.match(/(^|\s)i(\s|'|’)/g) || []).length;
    const lowStart = sentences.filter(s => /^[a-z]/.test(s)).length;
    const rows = [];
    const min = task.minWords || 150;
    rows.push(wc < min * 0.85 ? ['r', `Length: ${wc} words — under the ${min}-word minimum. Short answers lose marks for task achievement.`]
      : wc < min ? ['a', `Length: ${wc} words — just under ${min}. Add one more supporting point.`]
        : wc > min * 1.8 ? ['a', `Length: ${wc} words — quite long. More words means more chances for mistakes and less time to check.`]
          : ['g', `Length: ${wc} words — meets the ${min}-word target.`]);
    const wantParas = task.type === 'email' ? 3 : 4;
    rows.push(paras.length >= wantParas ? ['g', `Paragraphs: ${paras.length} — clearly organised.`] : ['a', `Paragraphs: ${paras.length}. Aim for at least ${wantParas} (${task.type === 'email' ? 'opening, main points, closing' : 'introduction, two body paragraphs, conclusion'}), with a blank line between them.`]);
    rows.push(linkers.length >= 5 ? ['g', `Linking words: ${linkers.length} different (${linkers.slice(0, 6).join(', ')}).`] : linkers.length >= 3 ? ['a', `Linking words: ${linkers.length} (${linkers.join(', ')}). Add a few more, e.g. ${suggest}.`] : ['r', `Linking words: only ${linkers.length}. B2 writing needs clear connections: "however", "moreover", "as a result", "for example", "although".`]);
    rows.push(avg > 0 && avg < 11 ? ['a', `Sentences: average ${avg.toFixed(1)} words — mostly short. Combine some with "which", "although" or "because" to show range.`] : longOnes > 1 ? ['a', `Sentences: ${longOnes} very long sentences (35+ words). Split them to stay accurate.`] : avg ? ['g', `Sentences: average ${avg.toFixed(1)} words — good variety.`] : ['a', 'Sentences: write full sentences ending with full stops.']);
    rows.push(b2.length >= 6 ? ['g', `B2 vocabulary: ${plural(b2.length, 'useful word')} (${b2.slice(0, 6).join(', ')}…).`] : ['a', `B2 vocabulary: ${plural(b2.length, 'word')} from our B2 list${b2.length ? ' (' + b2.join(', ') + ')' : ''}. Upgrade simple words: big → significant, good → beneficial, get → obtain.`]);
    if (repeats.length) rows.push(['a', `Repetition: ${repeats.map(([w, n]) => `"${w}" ×${n}`).join(', ')}. Use synonyms or pronouns.`]);
    if (miss.length) rows.push(['r', `Spelling: ${miss.map(w => `${w} → ${MISSPELL[w]}`).join(', ')}.`]);
    if (contractions.length) rows.push(['a', `Formal tone: avoid contractions in ${task.type === 'email' ? 'a formal email' : 'an essay'} (${contractions.slice(0, 5).join(', ')}). Write "do not", "I am", etc.`]);
    if (lowerI) rows.push(['r', `Capital letters: write "I" as a capital letter (${lowerI}×).`]);
    if (lowStart) rows.push(['a', `Capital letters: ${lowStart} sentence${lowStart > 1 ? 's start' : ' starts'} with a small letter.`]);
    if (task.type === 'email') {
      const greet = /^\s*(dear|hi|hello)\b/i.test(clean);
      const close = /(yours sincerely|yours faithfully|kind regards|best regards|best wishes|regards|warm wishes|all the best|many thanks|thanks|thank you|love|cheers|take care|see you|speak soon)[\s,!.]*\n?[\s\S]{0,40}$/i.test(clean.trim());
      rows.push(greet ? ['g', 'Opening: includes a greeting.'] : ['r', 'Opening: start with a greeting, e.g. "Dear Mr Patel," (formal) or "Hi Sam," (informal).']);
      rows.push(close ? ['g', 'Closing: includes a sign-off.'] : ['r', `Closing: end with a sign-off, e.g. ${task.formality === 'formal' ? '"Yours sincerely," or "Yours faithfully,"' : '"Best wishes," or "Take care,"'} and your name.`]);
    }
    return { wc, rows, html: `<ul class="checks">${rows.map(r => checkRow(...r)).join('')}</ul>` };
  }

  function skillScores() {
    const out = { reading: [], listening: [], writing: [], speaking: [] };
    Object.values(S.mocks).forEach(m => {
      ['reading', 'listening'].forEach(k => { if (m[k]) out[k].push({ p: pct(m[k].score, m[k].total), at: m[k].at }); });
    });
    Object.values(S.drills).forEach(v => { if (out[v.skill]) out[v.skill].push({ p: pct(v.score, v.total), at: v.at }); });
    Object.values(S.writing).forEach(v => { if (v.self != null) out.writing.push({ p: Math.round(v.self / 12 * 100), at: v.at }); });
    Object.values(S.speaking).forEach(v => { if (v.self != null) out.speaking.push({ p: Math.round(v.self / 12 * 100), at: v.at }); });
    const res = {};
    Object.keys(out).forEach(k => {
      const arr = out[k].sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 3);
      res[k] = arr.length ? Math.round(sum(arr.map(x => x.p)) / arr.length) : null;
    });
    const gv = Object.values(S.grammar);
    res.grammar = gv.length ? Math.round(sum(gv.map(b => pct(b.best, b.total))) / gv.length) : null;
    const vw = Object.values(S.vocab);
    const totalWords = D.vocab.reduce((a, t) => a + (t.words ? t.words.length : (t.count || 0)), 0);
    res.vocab = vw.length ? Math.round(vw.filter(v => v.box >= 2).length / Math.max(1, totalWords) * 100) : null;
    return res;
  }

  // Fitness-style rings: each closes when the skill reaches the B2 line (60%).
  function rings(sc) {
    const keys = ['reading', 'listening', 'writing', 'speaking'];
    const sw = 15, gap = 3;
    return `<svg class="rings" viewBox="0 0 200 200" role="img" aria-label="B2 readiness rings">${keys.map((k, i) => {
      const r = 100 - sw / 2 - 2 - i * (sw + gap), c = 2 * Math.PI * r;
      const prog = Math.min(1, (sc[k] || 0) / 60), off = c * (1 - prog);
      const col = 'var(--c-' + SKILLS[k][2] + ')';
      return `<circle cx="100" cy="100" r="${r}" stroke="${col}" stroke-opacity=".2" stroke-width="${sw}"/>` +
        (prog > 0 ? `<circle class="ring-fg" cx="100" cy="100" r="${r}" stroke="${col}" stroke-width="${sw}" stroke-dasharray="${c.toFixed(1)}" style="stroke-dashoffset:${off.toFixed(1)};--c:${c.toFixed(1)}" transform="rotate(-90 100 100)"/>` : '');
    }).join('')}</svg>`;
  }
  function legendRow(k, p) {

    }).join('')}</div>
      <div class="row mt2">${allDone ? `<a class="btn lg" href="#/mock/${m.id}/results">${ico('star')}See your results</a>` : `<a class="btn lg" href="#/mock/${m.id}/${(secs.find(s => !r[s[0]]) || secs[0])[0]}">${ico('play')}Start next section</a>`}
      ${Object.keys(r).length && !allDone ? `<a class="btn ghost lg" href="#/mock/${m.id}/results">Results so far</a>` : ''}</div>${footer()}`;
  }

  function mockSection(id, sec) {
    const m = mockById(id);
    if (!m) return notFound();
    if (m.locked) { location.hash = '#/unlock'; return; }
    const setRes = (k, res) => { S.mocks[m.id] = S.mocks[m.id] || {}; S.mocks[m.id][k] = res; };
    const label = 'Mock ' + (D.mocks.indexOf(m) + 1);
    if (sec === 'reading') return readingRun(m.reading.passages, { title: label + ' · Reading', time: m.reading.time, back: '#/mock/' + m.id, save: res => setRes('reading', res), next: '#/mock/' + m.id + '/listening', nextLabel: 'Listening' });
    if (sec === 'listening') return listeningRun(m.listening.parts, { title: label + ' · Listening', exam: true, back: '#/mock/' + m.id, save: res => setRes('listening', res), next: '#/mock/' + m.id + '/writing', nextLabel: 'Writing' });
    if (sec === 'writing') return writingMock(m, label);
    if (sec === 'speaking') return speakingMock(m, label);
  }

  function examBar(o, total, qnav) {
    return `<div class="exambar"><div class="row between">
      <div class="row" style="gap:10px;min-width:0"><a class="btn quiet sm" href="${o.back}" aria-label="Exit">${ico('arrowL')}Exit</a><span class="ttl">${esc(o.title)}<small class="muted">${total} questions</small></span></div>
      <div class="row">${o.time ? `<span class="timer" id="tmr">${fmt(o.time * 60)}</span>` : ''}<button class="btn sm" id="submit">Submit</button></div>
    </div>${qnav}</div>`;
  }
  function resultCard(score, tot, msg, o) {
    const p = pct(score, tot), b = band(p);
    return `<div class="card pad-lg"><div class="result">
      <div class="score">${score}<small class="muted">/${tot}</small></div>
      <div><div class="row" style="margin-bottom:4px"><b>${p}% correct</b><span class="badge ${b.cls}">${b.label}</span></div><p class="muted mb0" style="font-size:.88rem">${msg}</p></div>
      <div class="row">${o.next ? `<a class="btn" href="${o.next}">${o.nextLabel ? 'Next: ' + esc(o.nextLabel) : 'Next'} ${ico('arrowR')}</a>` : ''}<button class="btn ghost" id="retry">${ico('redo')}Try again</button></div>
    </div></div>`;
  }

  function readingRun(passages, o) {
    let start = 1;
    const starts = passages.map(p => { const s = start; start += countItems(p.groups); return s; });
    const total = start - 1;
    const sets = passages.map((p, i) => ({ prefix: 'p' + i, groups: p.groups, start: starts[i] }));
    view().innerHTML = examBar(o, total, qnavHTML(sets)) + `
      ${passages.length > 1 ? `<div class="seg" id="ptabs" style="margin-bottom:14px">${passages.map((p, i) => `<button type="button" class="${i === 0 ? 'on' : ''}" data-p="${i}">Text ${i + 1}</button>`).join('')}</div>` : ''}
      <div id="pwrap">${passages.map((p, i) => {
      const r = renderGroups(p.groups, 'p' + i, starts[i]);
      return `<div class="split ${i === 0 ? '' : 'hide'}" data-pane="${i}">
          <article class="card passage"><div class="kicker">Text ${i + 1} of ${passages.length}</div><div class="ptitle">${esc(p.title)}</div>${p.intro ? `<p class="muted" style="font-size:.86rem">${esc(p.intro)}</p>` : ''}
          <div class="pbody mt">${p.paras.map((t, pi) => `<p>${p.labels ? `<span class="pl">${String.fromCharCode(65 + pi)}</span>` : ''}${esc(t)}</p>`).join('')}</div></article>
          <div class="card qcard">${r.html}${i < passages.length - 1 ? `<div class="row mt"><button class="btn ghost" data-p="${i + 1}">Text ${i + 2} ${ico('arrowR')}</button></div>` : ''}</div>
        </div>`;
    }).join('')}</div>
      <div id="result" class="mt"></div>${footer()}`;
    const show = i => {
      $$('[data-pane]', $('#pwrap')).forEach(el => el.classList.toggle('hide', +el.dataset.pane !== i));
      $$('#ptabs [data-p]').forEach(b => b.classList.toggle('on', +b.dataset.p === i));
    };
    view().addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) { show(+b.dataset.p); if (!b.closest('#ptabs')) window.scrollTo({ top: 0, behavior: 'smooth' }); } });
    mountQnav(view(), show);
    let timer, done = false;
    const submit = auto => {
      if (done) return;
      if (!auto) { const un = unansweredCount(view()); if (un && !confirm(`You have ${un} unanswered question${un > 1 ? 's' : ''}. Submit anyway?`)) return; }
      done = true; timer && timer.stop();
      let score = 0, tot = 0;
      passages.forEach((p, i) => { const r = gradeGroups(p.groups, 'p' + i, view()); score += r.score; tot += r.total; });
      markQnav();
      o.save && o.save({ score, total: tot, at: Date.now() }); markActive(); save();
      $('#submit').disabled = true;
      $('#result').innerHTML = resultCard(score, tot, pct(score, tot) >= 60 ? 'Reading at B2 level on this test. Review the explanations — they show where each answer is in the text.' : 'Read each explanation, then find the evidence in the text. B2 reading is about detail: watch for words like "only", "all" and "most", and for paraphrases.', o);
      $('#retry').addEventListener('click', () => route());
      if (auto) toast('Time is up — answers submitted');
      $('#result').scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
    $('#submit').addEventListener('click', () => submit(false));
    if (o.time) timer = countdown($('#tmr'), o.time * 60, () => submit(true));
  }

  function listeningRun(parts, o) {
    let start = 1;
    const starts = parts.map(p => { const s = start; start += countItems(p.groups); return s; });
    const total = start - 1;
    const sets = parts.map((p, i) => ({ prefix: 'l' + i, groups: p.groups, start: starts[i] }));
    view().innerHTML = examBar(o, total, qnavHTML(sets)) + `
      ${o.exam && S.settings.examMode ? note('Exam mode: each recording can be played <b>twice</b>. Read the questions before you press play. You can change this in Settings.', '', 'info') : note('Read the questions first, then play the recording. In practice mode you can replay as often as you like.', '', 'info')}
      ${parts.map((p, i) => {
      const r = renderGroups(p.groups, 'l' + i, starts[i]);
      return `<div class="card pad-lg mt"><div class="kicker">Part ${i + 1} of ${parts.length}</div><p style="font-size:.9rem">${esc(p.context)}</p>${playerHTML(p, 'l' + i)}
          ${r.html}
          <details class="box mt hide" data-tr="${i}"><summary>${ico('eye')}Transcript</summary>${transcriptHTML(p)}</details></div>`;
    }).join('')}
      <div id="result" class="mt"></div>${footer()}`;
    parts.forEach((p, i) => mountPlayer(p, 'l' + i, { exam: o.exam }));
    mountQnav(view());
    let done = false;
    $('#submit').addEventListener('click', () => {
      if (done) return;
      const un = unansweredCount(view());
      if (un && !confirm(`You have ${un} unanswered question${un > 1 ? 's' : ''}. Submit anyway?`)) return;
      done = true; TTS.stop();
      let score = 0, tot = 0;
      parts.forEach((p, i) => { const r = gradeGroups(p.groups, 'l' + i, view()); score += r.score; tot += r.total; });
      markQnav();
      $$('[data-tr]').forEach(d => d.classList.remove('hide'));
      o.save && o.save({ score, total: tot, at: Date.now() }); markActive(); save();
      $('#submit').disabled = true;
      $('#result').innerHTML = resultCard(score, tot, 'Open each transcript and find the sentence with the answer. Notice how speakers paraphrase the words in the questions — that is the key B2 listening skill.', o);
      $('#retry').addEventListener('click', () => route());
      $('#result').scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }

  const taskKind = t => t.type === 'email' ? (t.formality === 'informal' ? 'Informal email' : t.formality === 'semi' ? 'Semi-formal email' : 'Formal email') : 'Essay';
  function writingTaskHTML(t, key, num) {
    const saved = S.writing[key] || {};
    return `<div class="card pad-lg mt" data-wtask="${key}">
      <div class="card-head"><div class="kicker" style="margin:0">${num ? 'Task ' + num + ' · ' : ''}${taskKind(t)}</div><span class="badge">${t.minWords}+ words · ~${t.time} min</span></div>
      <h2 style="font-size:1.15rem">${esc(t.title)}</h2>
      <div class="prompt">${esc(t.prompt)}${t.bullets ? '\n' + t.bullets.map(b => '•  ' + b).join('\n') : ''}</div>
      <textarea class="essay mt" data-w="text" placeholder="Write your answer here…" spellcheck="false" aria-label="Your answer">${esc(saved.text || '')}</textarea>
      <div class="row between mt"><span class="wc muted" data-w="wc">0 words</span><div class="row"><button class="btn ghost" data-w="model">${ico('eye')}Model answer</button><button class="btn" data-w="check">${ico('check')}Check my writing</button></div></div>
      <div class="mt2 hide" data-w="out"></div>
      <div class="mt2 hide" data-w="modelbox"><h3>B2 model answer</h3><div class="model">${esc(t.model || 'Model answer coming soon.')}</div>${t.notes ? `<p class="mt muted mb0" style="font-size:.86rem"><b style="color:var(--ink)">Why it works:</b> ${esc(t.notes)}</p>` : ''}</div>
    </div>`;
  }
  function mountWritingTask(t, key, onSelf) {
    const root = $(`[data-wtask="${key}"]`);
    const ta = $('[data-w=text]', root), wc = $('[data-w=wc]', root);
    const upd = () => { const n = (ta.value.match(/[A-Za-z’'-]+/g) || []).length; wc.textContent = n + ' words' + (n < t.minWords ? ` · ${t.minWords - n} to go` : ' · target met'); wc.style.color = n >= t.minWords ? 'var(--good)' : ''; };
    let saveT;
    ta.addEventListener('input', () => { upd(); clearTimeout(saveT); saveT = setTimeout(() => { S.writing[key] = Object.assign(S.writing[key] || {}, { text: ta.value }); save(); }, 600); });
    upd();
    $('[data-w=model]', root).addEventListener('click', () => $('[data-w=modelbox]', root).classList.toggle('hide'));
    $('[data-w=check]', root).addEventListener('click', () => {
      const a = analyseWriting(ta.value, t);
      const out = $('[data-w=out]', root);
      const saved = (S.writing[key] || {}).rub;
      out.innerHTML = `<h3>Instant feedback</h3>${a.html}
        <p class="muted mt" style="font-size:.78rem">Checks length, organisation, linking, vocabulary and common errors. They can't fully judge grammar or ideas — compare with the model answer and score yourself honestly.</p>
        <h3 class="mt2">Score yourself like an examiner</h3>${rubricHTML(W_RUBRIC, key, saved)}`;
      out.classList.remove('hide');
      mountRubric(W_RUBRIC, key, saved, sc => {
        S.writing[key] = Object.assign(S.writing[key] || {}, { text: ta.value, rub: sc, at: Date.now() });
        if (Object.keys(sc).length === 4) { S.writing[key].self = sum(Object.values(sc)); onSelf && onSelf(); }
        save();
      });
      S.writing[key] = Object.assign(S.writing[key] || {}, { text: ta.value, words: a.wc, checkedAt: Date.now() }); markActive(); save();
    });
  }

  function writingMock(m, label) {
    const o = { title: label + ' · Writing', back: '#/mock/' + m.id, time: m.writing.time };
    view().innerHTML = `<div class="exambar"><div class="row between">
        <div class="row" style="gap:10px"><a class="btn quiet sm" href="${o.back}">${ico('arrowL')}Exit</a><span class="ttl">${esc(o.title)}<small class="muted">${m.writing.tasks.length} tasks</small></span></div>
        <div class="row"><span class="timer" id="tmr">${fmt(o.time * 60)}</span><button class="btn sm" id="finish">Finish section</button></div></div></div>
      ${note(`Write both tasks. Spend about ${m.writing.tasks.map((t, i) => t.time + ' minutes on Task ' + (i + 1)).join(' and ')}. Then press <b>Check my writing</b> on each task and score yourself.`, '', 'info')}
      ${m.writing.tasks.map((t, i) => writingTaskHTML(t, m.id + '-w' + i, i + 1)).join('')}
      <div id="result" class="mt"></div>${footer()}`;
    const finishSave = () => {
      const selfs = m.writing.tasks.map((t, i) => S.writing[m.id + '-w' + i] && S.writing[m.id + '-w' + i].self).filter(v => v != null);
      S.mocks[m.id] = S.mocks[m.id] || {};
      S.mocks[m.id].writing = { self: selfs.length ? Math.round(sum(selfs) / selfs.length) : null, at: Date.now() };
      save();
    };
    m.writing.tasks.forEach((t, i) => mountWritingTask(t, m.id + '-w' + i, finishSave));
    countdown($('#tmr'), o.time * 60, () => toast('Time is up — finish your sentence and check your writing'));
    $('#finish').addEventListener('click', () => {
      finishSave(); markActive();
      const w = S.mocks[m.id].writing;
      $('#result').innerHTML = `<div class="card pad-lg"><h2>Writing section saved</h2><p class="muted">${w.self != null ? `Your self-score: <b style="color:var(--ink)">${w.self}/12</b> — ${selfBand(w.self).label}.` : 'Tip: press "Check my writing" and score both tasks to get a level estimate.'}</p><a class="btn" href="#/mock/${m.id}/speaking">Next: Speaking ${ico('arrowR')}</a></div>`;
      $('#result').scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }

  function speakingMock(m, label) {
    const sp = m.speaking;
    const key = m.id + '-s';
    view().innerHTML = backLink('#/mock/' + m.id, 'Back to ' + label) + ph(label + ' · Speaking', 'Speaking test', 'Three parts, like a real B2 speaking test. Answer out loud and record yourself so you can listen back.') + `
      <div class="card pad-lg"><div class="kicker">Part 1 · Interview · about 4 minutes</div><h2>${esc(sp.part1.topic)}</h2>
        <p class="muted" style="font-size:.88rem">Answer each question in 2–4 sentences. Give a reason or an example every time.</p>
        <ol style="padding-left:20px;margin:0 0 16px;font-size:.92rem">${sp.part1.qs.map(q => `<li style="margin-bottom:6px">${esc(q)}</li>`).join('')}</ol>
        ${recorderHTML(key + '1', 240)}</div>
      <div class="card pad-lg mt"><div class="kicker">Part 2 · Long turn · 1 minute to prepare, 2 minutes to speak</div>
        <div class="cue mt"><h3>${esc(sp.part2.title)}</h3><p class="mb0 muted" style="font-size:.88rem">You should say:</p><ul>${sp.part2.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul></div>
        <div class="row mt"><button class="btn ghost" id="prep">${ico('clock')}Start 1-minute preparation</button><span class="timer hide" id="prept">01:00</span></div>
        <textarea class="mt" rows="3" placeholder="Notes for your preparation minute (key words only)…" aria-label="Notes"></textarea>
        <div class="mt">${recorderHTML(key + '2', 120)}</div>
        ${sp.part2.model ? `<details class="box mt"><summary>B2 model answer</summary><div class="model">${esc(sp.part2.model)}</div></details>` : ''}</div>
      <div class="card pad-lg mt"><div class="kicker">Part 3 · Discussion · about 4 minutes</div>
        <p class="muted" style="font-size:.88rem">More abstract questions. Give opinions, compare, speculate and justify.</p>
        <ol style="padding-left:20px;margin:0 0 16px;font-size:.92rem">${sp.part3.qs.map(q => `<li style="margin-bottom:6px">${esc(q)}</li>`).join('')}</ol>
        ${recorderHTML(key + '3', 240)}
        ${sp.part3.model ? `<details class="box mt"><summary>Sample B2 answer to question 1</summary><div class="model">${esc(sp.part3.model)}</div></details>` : ''}</div>
      <div class="card pad-lg mt"><h2>Score your speaking</h2><p class="muted" style="font-size:.88rem">Listen to your recordings, then be honest. B2 is mostly 2s.</p>${rubricHTML(S_RUBRIC, key, (S.speaking[key] || {}).rub)}
        <div class="row mt"><button class="btn" id="finish">${ico('check')}Save and see results</button></div></div>
      ${footer()}`;
    mountRecorder(key + '1', 240); mountRecorder(key + '2', 120); mountRecorder(key + '3', 240);
    $('#prep').addEventListener('click', () => {
      const t = $('#prept'); t.classList.remove('hide'); $('#prep').disabled = true;
      countdown(t, 60, () => { toast('Preparation over — start speaking'); t.textContent = 'Speak now'; });
    });
    mountRubric(S_RUBRIC, key, (S.speaking[key] || {}).rub, sc => {
      S.speaking[key] = { rub: sc, at: Date.now(), self: Object.keys(sc).length === 4 ? sum(Object.values(sc)) : null }; save();
    });
    $('#finish').addEventListener('click', () => {
      const s = S.speaking[key];
      S.mocks[m.id] = S.mocks[m.id] || {};
      S.mocks[m.id].speaking = { self: s && s.self != null ? s.self : null, at: Date.now() };
      markActive(); save();
      location.hash = '#/mock/' + m.id + '/results';
    });
  }

  function mockResults(id) {
    const m = mockById(id);
    if (!m || m.locked) return notFound();
    const r = S.mocks[m.id] || {};
    const rows = ['reading', 'listening', 'writing', 'speaking'].map(k => {
      const x = r[k];
      if (!x) return { k, p: null };
      const p = x.total ? pct(x.score, x.total) : (x.self != null ? Math.round(x.self / 12 * 100) : null);
      return { k, p, raw: x.total ? `${x.score}/${x.total}` : (x.self != null ? `${x.self}/12 (self)` : 'not scored') };
    });
    const scored = rows.filter(x => x.p != null);
    const weakest = scored.slice().sort((a, b) => a.p - b.p)[0];
    const allB2 = rows.every(x => x.p != null && x.p >= 60);
    const tips = { reading: '#/practice/reading', listening: '#/practice/listening', writing: '#/writing', speaking: '#/speaking' };
    const label = 'Mock ' + (D.mocks.indexOf(m) + 1);
    const ex = S.exam && examById(S.exam);
    view().innerHTML = backLink('#/mock/' + m.id, 'Back to ' + label) + ph(label + ' · Results', allB2 ? 'B2 in every skill' : scored.length < 4 ? 'Your results so far' : 'Nearly there', 'UK visa tests need B2 in <b style="color:var(--ink)">each</b> skill separately — a strong score in one skill can\'t make up for a weak one.') + `
      <div class="card pad-lg">
        ${rows.map(x => meter(x.k, x.p).replace('<div class="val">', `<div class="val">${x.raw ? `<span class="muted" style="margin-right:6px">${x.raw}</span>` : `<a href="#/mock/${m.id}/${x.k}">Start</a>`}`)).join('')}
      </div>
      ${weakest && weakest.p < 60 ? `<div class="mt">${note(`Focus next on <b>${SKILLS[weakest.k][0]}</b>. <a href="${tips[weakest.k]}">Practise ${SKILLS[weakest.k][0].toLowerCase()}</a>`, 'warn', 'target')}</div>` : ''}
      ${ex ? `<div class="mt">${note(`Your test: <b>${esc(ex.name)}</b> — you need <b>${esc(ex.b2)}</b>.`, '', 'info')}</div>` : ''}
      <div class="row mt2">${(() => { const i = D.mocks.indexOf(m); const nx = D.mocks[i + 1]; return nx ? `<a class="btn" href="${nx.locked ? '#/unlock' : '#/mock/' + nx.id}">Next mock test ${ico('arrowR')}</a>` : ''; })()}<a class="btn ghost" href="#/home">Dashboard</a></div>
      <p class="muted mt" style="font-size:.78rem">Estimates compare your percentage with typical B2 performance. They are a guide, not an official score.</p>${footer()}`;
  }

  /* ---------- practice: reading & listening drills ---------- */
  function drillList(skill) {
    const items = skill === 'reading' ? allPassages() : allParts();
    const [name, icn, cls] = SKILLS[skill];
    view().innerHTML = ph('Practice', name, skill === 'reading' ? 'Short B2 texts on topics that come up in UK visa tests: work, housing, health, technology, the environment and everyday life in the UK.' : 'Conversations and talks in British English. Use headphones, read the questions first, then listen.') + `
      ${skill === 'listening' && !TTS.ok ? note('Audio needs a browser with speech support (Chrome, Edge or Safari). Transcripts are always available.', 'warn', 'alert') : ''}
      <ul class="list card">${items.map(p => {
      const res = S.drills[p.id];
      return `<li><a class="item" href="${p.locked ? '#/unlock' : '#/practice/' + skill + '/' + p.id}"><span class="lico ico ${cls}">${ico(icn)}</span>
          <div class="grow"><b>${esc(p.title)}</b><small class="muted">Mock ${D.mocks.indexOf(p.mock) + 1}${p.locked ? '' : ' · ' + plural(countItems(p.groups), 'question')}</small></div>
          ${p.locked ? `<span class="badge lockb">${ico('lock')}Full</span>` : res ? `<span class="badge ${band(pct(res.score, res.total)).cls}">${res.score}/${res.total}</span>` : ico('chevR', 'chev')}</a></li>`;
    }).join('')}</ul>${footer()}`;
  }
  function drillRun(skill, pid) {
    const items = skill === 'reading' ? allPassages() : allParts();
    const p = items.find(x => x.id === pid);
    if (!p) return notFound();
    if (p.locked) { location.hash = '#/unlock'; return; }
    const nx = items[items.indexOf(p) + 1];
    const o = { title: p.title, back: '#/practice/' + skill, save: res => { S.drills[p.id] = Object.assign(res, { skill }); }, next: nx && !nx.locked ? '#/practice/' + skill + '/' + nx.id : null, nextLabel: nx && !nx.locked ? 'next ' + skill + ' practice' : '' };
    if (skill === 'reading') readingRun([p], o); else listeningRun([p], o);
  }

  /* ---------- grammar ---------- */
  function grammarList() {
    view().innerHTML = ph('Practice', 'Grammar for B2', 'The structures B2 examiners reward in writing and speaking. Each topic has a short explanation and a drill with instant feedback.') + `
      <div class="grid g3">${D.grammar.map(g => {
      const r = S.grammar[g.id];
      return `<a class="card tile" href="${g.locked ? '#/unlock' : '#/grammar/' + g.id}"><div class="ico g">${ico('blocks')}</div><h3>${esc(g.title)}</h3><p>${esc(g.sub || '')}</p>
          ${g.locked ? lockBadge : r ? `<span class="badge ${band(pct(r.best, r.total)).cls} lock">Best ${r.best}/${r.total}</span>` : `<span class="go">${ico('arrowR')}</span>`}</a>`;
    }).join('')}</div>${footer()}`;
  }
  function grammarRun(id) {
    const g = D.grammar.find(x => x.id === id);
    if (!g) return notFound();
    if (g.locked) { location.hash = '#/unlock'; return; }
    const groups = [{ instr: 'Choose or type the correct answer.', items: g.items }];
    const r = renderGroups(groups, 'g', 1);
    view().innerHTML = backLink('#/grammar', 'All grammar topics') + ph('Grammar', esc(g.title), esc(g.sub || '')) + `
      <details class="box" open><summary>Explanation</summary><div class="gexp">${g.explain}</div></details>
      <div class="card qcard mt">${r.html}<div class="row mt"><button class="btn" id="check">${ico('check')}Check answers</button></div></div>
      <div id="result" class="mt"></div>${footer()}`;
    $('#check').addEventListener('click', () => {
      const res = gradeGroups(groups, 'g', view());

  /* ---------- vocabulary ---------- */
  const BOX_DAYS = [0, 1, 3, 7, 16, 35];
  function vocabList() {
    const now = Date.now();
    view().innerHTML = ph('Practice', 'B2 vocabulary', 'Topic word sets with definitions and example sentences. Flashcards use spaced repetition, so words you find hard come back sooner.') + `
      <div class="grid g3">${D.vocab.map(t => {

      const learned = t.words.filter(w => S.vocab[w.id] && S.vocab[w.id].box >= 2).length;
      const due = t.words.filter(w => S.vocab[w.id] && S.vocab[w.id].due <= now).length;
      return `<a class="card tile" href="#/vocab/${t.id}"><div class="ico v">${ico('cards')}</div><h3>${esc(t.topic)}</h3><p>${t.words.length} words · ${learned} learned${due ? ` · <b style="color:var(--accent)">${due} due</b>` : ''}</p><span class="go">${ico('arrowR')}</span><div class="foot"><div class="bar good"><i style="width:${pct(learned, t.words.length)}%"></i></div></div></a>`;
    }).join('')}</div>${footer()}`;
  }
  function vocabTopic(id) {
    const t = D.vocab.find(x => x.id === id);
    if (!t) return notFound();
    if (t.locked) { location.hash = '#/unlock'; return; }
    view().innerHTML = backLink('#/vocab', 'All topics') + ph('Vocabulary', esc(t.topic), plural(t.words.length, 'word') + ' with definitions and examples.') + `
      <div class="row"><a class="btn" href="#/vocab/${t.id}/cards">${ico('cards')}Flashcards</a><a class="btn ghost" href="#/vocab/${t.id}/quiz">${ico('check')}Quiz</a></div>
      <ul class="list card mt">${t.words.map(w => `<li><div class="grow"><b>${esc(w.w)}</b> <span class="muted" style="font-size:.78rem">${esc(w.pos)}</span><small style="color:var(--ink-2);margin-top:2px">${esc(w.def)}</small><small class="muted" style="font-style:italic">“${esc(w.ex)}”</small></div>
        ${S.vocab[w.id] && S.vocab[w.id].box >= 2 ? '<span class="badge good">Learned</span>' : ''}</li>`).join('')}</ul>${footer()}`;
  }
  function vocabMode(id, mode) {
    const t = D.vocab.find(x => x.id === id);
    if (!t || t.locked) return notFound();
    if (mode === 'quiz') return vocabQuiz(t);
    const now = Date.now();
    const due = t.words.filter(w => S.vocab[w.id] && S.vocab[w.id].due <= now);
    const fresh = t.words.filter(w => !S.vocab[w.id]);
    let queue = shuffle(due).concat(fresh.slice(0, 12));
    if (!queue.length) queue = shuffle(t.words).slice(0, 10);
    let i = 0, seen = 0;
    const draw = () => {
      if (i >= queue.length) {
        view().innerHTML = backLink('#/vocab/' + t.id, t.topic) + `<div class="card pad-lg center" style="max-width:560px;margin:0 auto"><h2>Session complete</h2><p class="muted">You reviewed ${plural(seen, 'card')}. Come back tomorrow for the cards that are due.</p><div class="row" style="justify-content:center"><a class="btn" href="#/vocab/${t.id}/quiz">Take the quiz</a><a class="btn ghost" href="#/vocab">All topics</a></div></div>`;
        return;
      }
      const w = queue[i];
      view().innerHTML = backLink('#/vocab/' + t.id, t.topic) + `
        <div style="max-width:560px;margin:0 auto">
        <div class="row between"><span class="kicker" style="margin:0">${esc(t.topic)}</span><span class="muted num" style="font-size:.82rem">${i + 1} / ${queue.length}</span></div>
        <div class="bar mt"><i style="width:${pct(i, queue.length)}%"></i></div>
        <div class="flash mt2" id="card" role="button" tabindex="0" aria-label="Flip card"><div class="flash-inner">
          <div class="flash-face"><div class="flash-word">${esc(w.w)}</div><div class="pos">${esc(w.pos)}</div><p class="muted mt mb0" style="font-size:.86rem">Say what it means and use it in a sentence, then tap to check.</p></div>
          <div class="flash-face back"><div style="font-weight:650">${esc(w.w)}</div><p class="mt" style="font-size:1.02rem">${esc(w.def)}</p><p class="muted mb0" style="font-style:italic;font-family:var(--serif)">“${esc(w.ex)}”</p></div>
        </div></div>
        <div class="row mt2" style="justify-content:center" id="grade">
          <button class="btn ghost" data-g="0">Again</button><button class="btn ghost" data-g="1">Good</button><button class="btn" data-g="2">Easy</button></div>
        <p class="center muted mt" style="font-size:.8rem">Tap the card or press Space to flip${TTS.ok ? ' · <a href="#" id="say">Hear it</a>' : ''}</p></div>`;
      const card = $('#card');
      const flip = () => card.classList.toggle('flip');
      card.addEventListener('click', flip);
      card.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
      card.focus({ preventScroll: true });
      const say = $('#say');
      if (say) say.addEventListener('click', e => { e.preventDefault(); TTS.say(w.w + '. ' + w.ex, 'f'); });
      $('#grade').addEventListener('click', e => {
        const b = e.target.closest('[data-g]'); if (!b) return;
        const g = +b.dataset.g, cur = S.vocab[w.id] || { box: 0 };
        const box = g === 0 ? 0 : Math.min(BOX_DAYS.length - 1, cur.box + g);
        S.vocab[w.id] = { box, due: Date.now() + BOX_DAYS[box] * 86400000 - 3600000 };
        if (g === 0) queue.push(w);
        seen++; i++; save(); if (seen === 1) markActive(); draw();
      });
    };
    draw();
  }
  function vocabQuiz(t) {
    const qs = shuffle(t.words).slice(0, 10).map(w => {
      const opts = shuffle([w, ...shuffle(t.words.filter(x => x !== w)).slice(0, 3)]);
      return { type: 'mcq', q: w.def, options: opts.map(o => o.w), answer: opts.indexOf(w), explain: '“' + w.ex + '”', _w: w };
    });
    const groups = [{ instr: 'Choose the word that matches each definition.', items: qs }];
    const r = renderGroups(groups, 'vq', 1);
    view().innerHTML = backLink('#/vocab/' + t.id, t.topic) + ph('Quiz', esc(t.topic), '') + `
      <div class="card qcard">${r.html}<div class="row mt"><button class="btn" id="check">${ico('check')}Check answers</button></div></div><div id="result" class="mt"></div>`;
    $('#check').addEventListener('click', () => {
      const res = gradeGroups(groups, 'vq', view());
      $('#check').disabled = true; markActive();
      qs.forEach((q, i) => {
        const ok = $(`[data-qid="vq-0-${i}"] .fb.ok`);
        const cur = S.vocab[q._w.id] || { box: 0 };
        if (ok) { const box = Math.min(BOX_DAYS.length - 1, cur.box + 1); S.vocab[q._w.id] = { box, due: Date.now() + BOX_DAYS[box] * 86400000 }; }
        else S.vocab[q._w.id] = { box: 0, due: Date.now() };
      });
      save();
      $('#result').innerHTML = resultCard(res.score, res.total, 'Words you got wrong are now due in your flashcards.', { next: '#/vocab/' + t.id + '/cards', nextLabel: 'Flashcards' });
      $('#retry').addEventListener('click', () => route());
      $('#result').scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }

    view().innerHTML = ph('Preferences', 'Settings', '') + `

        <label class="mt" style="display:block"><b>Your test</b><select id="ex" class="mt"><option value="">Not sure yet</option>${D.exams.map(e => `<option value="${e.id}" ${S.exam === e.id ? 'selected' : ''}>${esc(e.name)} — B2: ${esc(e.b2)}</option>`).join('')}</select></label></div>
      <div class="card pad-lg"><h2>Listening audio</h2>
        ${TTS.ok ? `<p class="muted" style="font-size:.88rem">Recordings are read by your device's built-in voices. British voices sound most like the real test — Microsoft Edge includes excellent free "Natural" British voices.</p>
        <div class="grid g2"><label><b>Female speaker</b><select id="va" class="mt">${vopts(S.settings.voiceA)}</select></label><label><b>Male speaker</b><select id="vb" class="mt">${vopts(S.settings.voiceB)}</select></label></div>
        <label class="mt" style="display:block"><b>Speed: <span id="rv" class="num">${S.settings.rate}</span>×</b><input type="range" id="rate" min="0.7" max="1.2" step="0.05" value="${S.settings.rate}" style="width:100%;margin-top:8px"></label>
        <div class="row mt"><button class="btn ghost" id="test">${ico('play')}Test voices</button>${en.length ? '' : '<span class="muted" style="font-size:.84rem">No English voices found yet — they may still be loading.</span>'}</div>
        <div class="hr"></div>
        <label class="row" style="gap:10px;font-size:.9rem"><input type="checkbox" id="exam" ${S.settings.examMode ? 'checked' : ''} style="width:16px;height:16px;accent-color:var(--ink)"> <span><b>Exam mode</b> — limit mock-test recordings to two plays</span></label>`
        : note('This browser has no speech engine, so listening audio cannot play. Use Chrome, Edge or Safari.', 'warn', 'alert')}</div>
      <div class="card pad-lg"><h2>Appearance</h2><div class="seg mt">${['auto', 'light', 'dark'].map(t => `<button type="button" class="${S.settings.theme === t ? 'on' : ''}" data-theme-btn="${t}">${t === 'auto' ? 'System' : t[0].toUpperCase() + t.slice(1)}</button>`).join('')}</div></div>
      <div class="card pad-lg"><h2>Your progress</h2><p class="muted" style="font-size:.88rem">Progress is saved on this device only — nothing is uploaded. Back it up to move to another device or browser.</p>
        <div class="row"><button class="btn ghost" id="exp">${ico('download')}Export progress</button><label class="btn ghost">Import progress<input type="file" id="imp" accept=".json,application/json" class="hide"></label><button class="btn danger" id="reset">Reset everything</button></div></div>
      ${D.hosted ? `<div class="card pad-lg"><h2>Full version</h2><p class="muted" style="font-size:.88rem">This device is unlocked with your code. Remove it if this is a shared or borrowed device.</p><button class="btn danger" id="relock">Remove unlock from this device</button></div>` : ''}
      <div class="card pad-lg"><h2>About</h2><p style="font-size:.9rem"><b>${esc(C.name)}</b> v${esc(C.version)} · ${FREE ? 'Free sample' : 'Full edition'} · ${esc(C.publisher)}</p>
        <p class="muted mb0" style="font-size:.82rem">${esc(C.disclaimer)}</p>${C.support ? `<p class="mt mb0" style="font-size:.88rem">Support: ${esc(C.support)}</p>` : ''}</div>`;
    $('#nm').addEventListener('change', e => { S.name = e.target.value.trim().slice(0, 30); save(); toast('Saved'); });
    $('#dt').addEventListener('change', e => { S.testDate = e.target.value; save(); toast('Saved'); });
    $('#ex').addEventListener('change', e => { S.exam = e.target.value || null; save(); toast('Saved'); });
    if (TTS.ok) {
      $('#va').addEventListener('change', e => { S.settings.voiceA = e.target.value; save(); });
      $('#vb').addEventListener('change', e => { S.settings.voiceB = e.target.value; save(); });
      $('#rate').addEventListener('input', e => { S.settings.rate = +e.target.value; $('#rv').textContent = e.target.value; save(); });
      $('#exam').addEventListener('change', e => { S.settings.examMode = e.target.checked; save(); });
      $('#test').addEventListener('click', () => {
        TTS.stop();
        [['f', 'Hello. I will be the female speaker in your listening tests.'], ['m', 'And I will be the male speaker. Good luck with your preparation.']].forEach(([g, t]) => {
          const u = new SpeechSynthesisUtterance(t); const v = TTS.pick(g); if (v) { u.voice = v; u.lang = v.lang; } u.rate = S.settings.rate; speechSynthesis.speak(u);
        });
      });
    }
    $$('[data-theme-btn]').forEach(b => b.addEventListener('click', () => { S.settings.theme = b.dataset.themeBtn; save(); applyTheme(); route(); }));
    $('#exp').addEventListener('click', () => {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' })); a.download = 'b2-ready-progress-' + today() + '.json'; a.click();
    });
    $('#imp').addEventListener('change', e => {
      const f = e.target.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => { try { const d = JSON.parse(rd.result); if (!d || typeof d !== 'object' || !d.settings) throw 0; S = Object.assign(defaults(), d); save(); toast('Progress imported'); route(); } catch (err) { toast('That file is not a valid progress backup'); } };
      rd.readAsText(f);
    });
    const rl = $('#relock');
    if (rl) rl.addEventListener('click', () => { if (confirm('Remove the unlock from this device? You can unlock again with your code.')) { try { localStorage.removeItem(B2_UNLOCK_KEY); } catch (e) { } location.reload(); } });
    $('#reset').addEventListener('click', () => { if (confirm('Delete all your progress, drafts and scores on this device?')) { S = defaults(); save(); applyTheme(); toast('Progress reset'); route(); } });
  }

  /* ---------- unlock ---------- */
  function unlock() {
    const st = D.stats;
    const links = (C.checkout || []).filter(l => l.url);
    view().innerHTML = FREE ? ph('Full version', 'Everything you need to reach B2', 'One payment. Lifetime access. Works offline on any device.') + `
      <div class="grid g-main">
        <div class="card pad-lg upsell">
          <div class="row between" style="align-items:flex-end"><div class="price">${esc(C.price)}<small>one-time</small></div><span class="badge good">${esc(C.refundShort || 'Lifetime access')}</span></div>
          <div class="hr"></div>
          ${tickList([
      `<b>${st.mocks} full mock tests</b> covering all four skills`,
      `<b>${st.passages} reading texts</b> and <b>${st.parts} listening recordings</b> in British English`,
      `<b>${st.writing} writing tasks</b> with B2 model answers and instant feedback`,
      `<b>${st.speaking} speaking topics</b> — record, transcribe and self-score`,
      `<b>${st.grammarItems} grammar questions</b> across ${st.grammar} B2 topics`,
      `<b>${st.words} B2 words</b> with spaced-repetition flashcards`,
      'Full phrase bank, 30-day study plan and progress tracking',
    ])}
          <div class="stack mt2">${links.length ? links.map((l, i) => `<a class="btn ${i === 0 ? 'accent lg' : 'ghost lg'} block" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('') : note('Checkout opens soon.', '', 'info')}</div>
          <p class="muted mt mb0" style="font-size:.78rem">Secure checkout. You get the full app as an instant download. ${esc(C.refund || '')}</p>
        </div>
        <div class="card pad-lg">
          <h2>Why ${esc(C.name)}</h2>
          ${tickList([
      'Built for the <b>B2 level</b> UK visas require — not generic English lessons.',
      'Task types used across <b>IELTS for UKVI, PTE Academic UKVI, LanguageCert SELT, Trinity ISE II and Skills for English</b>.',
      'Shows your <b>level in each skill</b> — the rules require B2 in every one.',
      'Costs less than one hour of private tutoring, and far less than a test retake.',
      'Private by design: no account, no tracking. Your progress stays on your device.',
    ])}
          <div class="mt2"><h3>Already bought it?</h3><p class="muted" style="font-size:.88rem">Enter the unlock code from your receipt. Your progress stays exactly where it is.</p>
            <form id="unlockForm" class="row" style="flex-wrap:nowrap"><input type="text" id="unlockCode" placeholder="B2-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Unlock code" style="flex:1;min-width:0;font-variant-numeric:tabular-nums;letter-spacing:.04em"><button class="btn" type="submit">Unlock</button></form>
            <p class="muted mt mb0" id="unlockMsg" style="font-size:.84rem"></p></div>
        </div>
      </div>${footer()}` : ph('Full edition', 'Everything is unlocked', '') + `
      <div class="card pad-lg"><p>Thank you for buying ${esc(C.name)}. All ${st.mocks} mock tests and every practice section are available.</p>
      <p class="muted" style="font-size:.88rem">${D.hosted ? 'This device is unlocked. To use it like an app, add this page to your home screen (Share → Add to Home Screen on iPhone, or the menu → Install app on Android and Chrome).' : 'Keep this file somewhere safe (for example Google Drive or your phone) and back up your progress from Settings.'}</p><a class="btn" href="#/home">Go to dashboard</a></div>${footer()}`;
    const form = $('#unlockForm');
    if (form) form.addEventListener('submit', async e => {
      e.preventDefault();
      const code = $('#unlockCode').value, msg = $('#unlockMsg');
      if (b2NormCode(code).length < 8) { msg.textContent = 'Enter the full code from your receipt, for example B2-ABCD-EFGH-JKLM.'; return; }
      if (!location.protocol.startsWith('http') || !(window.crypto && crypto.subtle)) { msg.textContent = 'Open the online version of the app to unlock it.'; return; }
      msg.textContent = 'Checking your code…';
      try { await B2Unlock(code); try { localStorage.setItem(B2_UNLOCK_KEY, b2NormCode(code)); } catch (_) { } msg.textContent = 'Unlocked. Opening the full version…'; setTimeout(() => location.reload(), 500); }
      catch (err) { msg.textContent = err && err.name === 'OperationError' ? 'That code doesn\'t match. Check it against your receipt and try again.' : 'Couldn\'t reach the app files. Check your connection and try again.'; }
    });
  }

  function notFound() {
    view().innerHTML = `<div class="card pad-lg center"><h2>Page not found</h2><p class="mb0"><a href="#/home">Back to the dashboard</a></p></div>`;
  }

  /* ================= ROUTER ================= */
  const routes = [
    [/^#?\/?(home)?$/, home],
    [/^#\/mocks$/, mocksList],
    [/^#\/mock\/([\w-]+)$/, mockOverview],
    [/^#\/mock\/([\w-]+)\/(reading|listening|writing|speaking)$/, mockSection],
    [/^#\/mock\/([\w-]+)\/results$/, mockResults],
    [/^#\/practice\/(reading|listening)$/, drillList],
    [/^#\/practice\/(reading|listening)\/([\w-]+)$/, drillRun],
    [/^#\/grammar$/, grammarList],
    [/^#\/grammar\/([\w-]+)$/, grammarRun],
    [/^#\/vocab$/, vocabList],
    [/^#\/vocab\/([\w-]+)$/, vocabTopic],
    [/^#\/vocab\/([\w-]+)\/(cards|quiz)$/, vocabMode],
    [/^#\/writing$/, writingList],
    [/^#\/writing\/([\w-]+)$/, writingRun],
    [/^#\/speaking$/, speakingList],
    [/^#\/speaking\/([\w-]+)$/, speakingRun],
    [/^#\/phrases$/, phrases],
    [/^#\/guide$/, guide],
    [/^#\/plan$/, plan],
    [/^#\/settings$/, settings],
    [/^#\/unlock$/, unlock],
  ];
  let lastHash = null;
  function route() {
    runCleanups();
    const h = location.hash || '#/home';
    const fresh = h !== lastHash; lastHash = h;
    const old = view(); const nv = old.cloneNode(false); old.parentNode.replaceChild(nv, old);
    const hit = routes.find(([re]) => re.test(h));
    if (!hit) notFound();
    else if (hit[1] === home) home();
    else hit[1](...h.match(hit[0]).slice(1));
    $$('[data-nav]').forEach(a => { const n = a.dataset.nav; a.classList.toggle('on', n === '#/home' ? (h === '#/home' || h === '' || h === '#/') : h.startsWith(n)); });
    if (fresh) { window.scrollTo(0, 0); nv.focus({ preventScroll: true }); }
    document.title = C.name + ' — B2 English practice for UK visas';
  }

  /* ================= BOOT ================= */
  applyTheme();
  shell();
  // radio options highlight (delegated once for every view)
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.matches && t.matches('.opt input[type=radio]')) $$(`input[name="${t.name}"]`).forEach(x => x.closest('.opt').classList.toggle('sel', x.checked));
  });
  window.addEventListener('hashchange', route);
  route();
  if ((FREE || D.hosted) && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => { });
  }
}

/* ---------- Unlock: the hosted sample ships the full edition AES-GCM encrypted (full.bin).
   A buyer's unlock code derives the key (PBKDF2-SHA256) and decrypts it in the browser. ---------- */
const B2_UNLOCK_KEY = 'b2ready.unlock';
const b2NormCode = c => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
async function B2Unlock(code) {
  const res = await fetch('full.bin', { cache: 'no-cache' });
  if (!res.ok) throw new Error('missing');
  const buf = new Uint8Array(await res.arrayBuffer());
  const salt = buf.slice(0, 16), iv = buf.slice(16, 28), data = buf.slice(28);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(b2NormCode(code)), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
  const full = JSON.parse(new TextDecoder().decode(plain));
  full.hosted = true;
  return full;
}
(async function boot() {
  let code = null;
  try { code = localStorage.getItem(B2_UNLOCK_KEY); } catch (e) { }
  if (window.B2DATA.edition === 'free' && code && window.crypto && crypto.subtle && location.protocol.startsWith('http')) {
    document.body.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:#6e6e73">Opening your full version…</div>';
    try { window.B2DATA = await B2Unlock(code); }
    catch (e) { if (e && e.name === 'OperationError') { try { localStorage.removeItem(B2_UNLOCK_KEY); } catch (_) { } } }
  }
  B2App();
})();
</script>
